<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOUNIR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

  :root {
    --bg: #0a0b0d;
    --bg-panel: #111317;
    --line: #1f2329;
    --amber: #d97b3e;
    --amber-dim: #8a5430;
    --amber-glow: rgba(217, 123, 62, 0.35);
    --text: #e8e6e1;
    --text-dim: #6b6f76;
    --text-mid: #9a9ea5;
    --ok: #5fa777;
    --warn: #c9694a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    height: 100%;
    overflow: hidden;
  }

  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ---------- background texture ---------- */
  .grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image: radial-gradient(circle at 20% 30%, rgba(217,123,62,0.04), transparent 45%),
                       radial-gradient(circle at 80% 70%, rgba(217,123,62,0.03), transparent 45%);
  }
  .scanline {
    position: fixed; inset: 0; pointer-events: none; z-index: 2; opacity: 0.025;
    background: repeating-linear-gradient(0deg, #fff 0px, transparent 1px, transparent 2px);
  }

  /* ---------- layout ---------- */
  .app {
    position: relative; z-index: 3;
    display: grid;
    grid-template-columns: 300px 1fr 300px;
    grid-template-rows: 64px 1fr 220px;
    height: 100vh;
    gap: 1px;
  }

  /* ---------- header ---------- */
  .header {
    grid-column: 1 / 4;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 12px var(--amber-glow);
    animation: pulse-dot 2.4s ease-in-out infinite;
  }
  @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.35} }
  .brand-name { font-size: 15px; letter-spacing: 0.32em; font-weight: 600; }
  .brand-sub { font-size: 11px; color: var(--text-dim); letter-spacing: 0.05em; margin-left: 4px; }

  .clock { font-size: 13px; color: var(--text-mid); letter-spacing: 0.05em; }
  .clock span { color: var(--amber); }

  /* ---------- side panels ---------- */
  .panel {
    border-right: 1px solid var(--line);
    padding: 22px 20px;
    overflow-y: auto;
  }
  .panel.right { border-right: none; border-left: 1px solid var(--line); }

  .panel-title {
    font-size: 10px; letter-spacing: 0.22em; color: var(--text-dim);
    text-transform: uppercase; margin-bottom: 18px;
    display: flex; align-items: center; gap: 8px;
  }
  .panel-title::after {
    content: ''; flex: 1; height: 1px; background: var(--line);
  }

  /* ---------- stat rows ---------- */
  .stat { margin-bottom: 20px; }
  .stat-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 7px;
  }
  .stat-label { font-size: 11px; color: var(--text-mid); letter-spacing: 0.04em; }
  .stat-value { font-size: 13px; font-weight: 500; color: var(--text); }
  .stat-value.accent { color: var(--amber); }
  .bar-track {
    height: 3px; background: var(--line); border-radius: 2px; overflow: hidden;
  }
  .bar-fill {
    height: 100%; background: var(--amber);
    box-shadow: 0 0 8px var(--amber-glow);
    transition: width 0.6s ease;
    border-radius: 2px;
  }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px; }
  .stat-box {
    border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px;
    background: linear-gradient(180deg, rgba(255,255,255,0.012), transparent);
  }
  .stat-box .num { font-size: 20px; font-weight: 500; }
  .stat-box .lbl { font-size: 10px; color: var(--text-dim); letter-spacing: 0.05em; margin-top: 4px; text-transform: uppercase; }

  /* sparkline */
  .spark { width: 100%; height: 32px; margin-top: 8px; }

  /* ---------- tools / status log right panel ---------- */
  .log-entry {
    font-size: 11.5px; line-height: 1.6; color: var(--text-mid);
    padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  .log-entry .t { color: var(--text-dim); font-size: 10px; display: block; margin-bottom: 2px; }
  .log-entry.tool .t { color: var(--amber-dim); }
  .log-entry.tool b { color: var(--amber); }

  /* ---------- center stage ---------- */
  .stage {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }

  .bubble-zone {
    position: relative; width: 320px; height: 320px;
    display: flex; align-items: center; justify-content: center;
  }

  .ring {
    position: absolute; border-radius: 50%;
    border: 1px solid var(--line);
  }
  .ring.r1 { width: 320px; height: 320px; }
  .ring.r2 { width: 250px; height: 250px; border-color: rgba(217,123,62,0.15); }

  .ring.spin {
    animation: spin 40s linear infinite;
    border-style: dashed;
    border-color: rgba(217,123,62,0.18);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .core {
    width: 168px; height: 168px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #1a1510, #0d0e10 70%);
    border: 1px solid var(--amber-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    position: relative;
    box-shadow: 0 0 40px rgba(217,123,62,0.08), inset 0 0 30px rgba(0,0,0,0.6);
    transition: box-shadow 0.4s ease, border-color 0.4s ease;
  }
  .core:hover { box-shadow: 0 0 60px rgba(217,123,62,0.16), inset 0 0 30px rgba(0,0,0,0.6); }

  .core.listening {
    border-color: var(--amber);
    box-shadow: 0 0 70px var(--amber-glow), inset 0 0 30px rgba(0,0,0,0.5);
  }
  .core.speaking {
    border-color: var(--amber);
    animation: speak-pulse 0.9s ease-in-out infinite;
  }
  @keyframes speak-pulse {
    0%,100% { box-shadow: 0 0 50px var(--amber-glow), inset 0 0 30px rgba(0,0,0,0.5); }
    50% { box-shadow: 0 0 90px var(--amber-glow), inset 0 0 30px rgba(0,0,0,0.5); }
  }

  .core-icon {
    width: 46px; height: 46px;
    position: relative; z-index: 2;
  }

  .breathe { animation: breathe 4.5s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }

  .wave-bars {
    position: absolute; display: flex; align-items: center; gap: 3px; z-index: 2;
  }
  .wave-bars span {
    display: block; width: 3px; border-radius: 2px;
    background: var(--amber); opacity: 0.85;
    height: 6px;
  }

  .status-label {
    margin-top: 30px; font-size: 11px; letter-spacing: 0.18em;
    color: var(--text-dim); text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
  }
  .status-label .dot {
    width: 5px; height: 5px; border-radius: 50%; background: var(--text-dim);
  }
  .status-label.active { color: var(--amber); }
  .status-label.active .dot { background: var(--amber); box-shadow: 0 0 8px var(--amber-glow); }

  .hint { margin-top: 10px; font-size: 11px; color: var(--text-dim); }
  .hint kbd {
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 2px 7px; font-family: 'JetBrains Mono', monospace; color: var(--text-mid);
  }

  /* ---------- bottom transcript ---------- */
  .transcript-bar {
    grid-column: 1 / 4;
    border-top: 1px solid var(--line);
    padding: 18px 28px;
    overflow-y: auto;
    display: flex; flex-direction: column-reverse;
  }
  .transcript-inner { display: flex; flex-direction: column; gap: 10px; max-width: 980px; margin: 0 auto; width: 100%; }

  .msg { display: flex; gap: 14px; font-size: 13.5px; line-height: 1.55; }
  .msg .who {
    flex-shrink: 0; width: 64px; font-size: 10px; letter-spacing: 0.1em;
    color: var(--text-dim); text-transform: uppercase; padding-top: 2px;
  }
  .msg.user .who { color: var(--text-mid); }
  .msg.assistant .who { color: var(--amber); }
  .msg .body { color: var(--text); }
  .msg.user .body { color: var(--text-mid); }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 980px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 56px auto 1fr 180px; }
    .panel { display: none; }
  }
</style>
</head>
<body>

<div class="grain"></div>
<div class="scanline"></div>

<div class="app">

  <div class="header">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-name">MOUNIR</div>
      <div class="brand-sub mono">local assistant · v0.1</div>
    </div>
    <div class="clock mono" id="clock">—</div>
  </div>

  <!-- LEFT PANEL: system vitals -->
  <div class="panel left">
    <div class="panel-title">System</div>

    <div class="stat-grid">
      <div class="stat-box">
        <div class="num mono" id="cpuNum">—%</div>
        <div class="lbl">CPU</div>
      </div>
      <div class="stat-box">
        <div class="num mono" id="ramNum">—%</div>
        <div class="lbl">Memory</div>
      </div>
    </div>

    <div class="stat">
      <div class="stat-head">
        <span class="stat-label">CPU LOAD</span>
        <span class="stat-value mono accent" id="cpuVal">0%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="cpuBar" style="width:0%"></div></div>
      <svg class="spark" id="cpuSpark" viewBox="0 0 280 32" preserveAspectRatio="none"></svg>
    </div>

    <div class="stat">
      <div class="stat-head">
        <span class="stat-label">MEMORY</span>
        <span class="stat-value mono accent" id="ramVal">0%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="ramBar" style="width:0%"></div></div>
      <svg class="spark" id="ramSpark" viewBox="0 0 280 32" preserveAspectRatio="none"></svg>
    </div>

    <div class="panel-title" style="margin-top:30px;">Network</div>
    <div class="stat">
      <div class="stat-head">
        <span class="stat-label">↓ DOWN</span>
        <span class="stat-value mono" id="netDown">0 KB/s</span>
      </div>
    </div>
    <div class="stat">
      <div class="stat-head">
        <span class="stat-label">↑ UP</span>
        <span class="stat-value mono" id="netUp">0 KB/s</span>
      </div>
    </div>

    <div class="panel-title" style="margin-top:30px;">Model</div>
    <div class="stat">
      <div class="stat-head">
        <span class="stat-label">ACTIVE</span>
        <span class="stat-value mono" id="modelName">groq · qwen3-32b</span>
      </div>
    </div>
    <div class="stat">
      <div class="stat-head">
        <span class="stat-label">LATENCY</span>
        <span class="stat-value mono" id="latency">— ms</span>
      </div>
    </div>
  </div>

  <!-- CENTER: voice bubble -->
  <div class="stage">
    <div class="bubble-zone">
      <div class="ring r1 spin"></div>
      <div class="ring r2"></div>
      <div class="core breathe" id="core">
        <svg class="core-icon" id="idleIcon" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="3" stroke="#d97b3e" stroke-width="1.4"/>
          <circle cx="12" cy="12" r="8.2" stroke="#8a5430" stroke-width="0.8" stroke-dasharray="2 3"/>
        </svg>
        <div class="wave-bars" id="waveBars" style="display:none;">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>
    <div class="status-label" id="statusLabel">
      <span class="dot"></span> IDLE
    </div>
    <div class="hint">Press <kbd>SPACE</kbd> or click the core to talk</div>
  </div>

  <!-- RIGHT PANEL: activity log -->
  <div class="panel right">
    <div class="panel-title">Activity</div>
    <div id="logList">
      <div class="log-entry mono">
        <span class="t">SYSTEM</span>
        Mounir initialized. Awaiting input.
      </div>
    </div>
  </div>

  <!-- BOTTOM: transcript -->
  <div class="transcript-bar">
    <div class="transcript-inner" id="transcript">
      <div class="msg assistant">
        <div class="who">MOUNIR</div>
        <div class="body">Online. Say the word, Ahmed.</div>
      </div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   CLOCK
============================================================ */
function tickClock(){
  const d = new Date();
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  const s = String(d.getSeconds()).padStart(2,'0');
  document.getElementById('clock').innerHTML = `${h}:${m}<span>:${s}</span>`;
}
setInterval(tickClock, 1000); tickClock();

/* ============================================================
   SPARKLINE RENDERER
============================================================ */
function makeSpark(svgEl, color){
  const data = new Array(40).fill(0);
  return {
    push(v){
      data.shift(); data.push(v);
      const w = 280, h = 32, step = w/(data.length-1);
      let d = '';
      data.forEach((val,i)=>{
        const x = i*step;
        const y = h - (val/100)*h;
        d += (i===0 ? `M${x},${y}` : ` L${x},${y}`);
      });
      svgEl.innerHTML = `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.4" opacity="0.85"/>`;
    }
  };
}
const cpuSpark = makeSpark(document.getElementById('cpuSpark'), '#d97b3e');
const ramSpark = makeSpark(document.getElementById('ramSpark'), '#9a9ea5');

/* ============================================================
   SYSTEM STATS — polls FastAPI backend (/stats)
   Falls back to simulated data if backend isn't reachable,
   so the UI is testable standalone.
============================================================ */
async function pollStats(){
  let data;
  try {
    const res = await fetch('/api/stats');
    data = await res.json();
  } catch(e){
    // fallback simulated data for standalone preview
    data = {
      cpu: 15 + Math.random()*25,
      ram: 40 + Math.random()*15,
      net_down: Math.random()*120,
      net_up: Math.random()*40,
    };
  }
  document.getElementById('cpuNum').textContent = Math.round(data.cpu)+'%';
  document.getElementById('ramNum').textContent = Math.round(data.ram)+'%';
  document.getElementById('cpuVal').textContent = Math.round(data.cpu)+'%';
  document.getElementById('ramVal').textContent = Math.round(data.ram)+'%';
  document.getElementById('cpuBar').style.width = data.cpu+'%';
  document.getElementById('ramBar').style.width = data.ram+'%';
  document.getElementById('netDown').textContent = Math.round(data.net_down)+' KB/s';
  document.getElementById('netUp').textContent = Math.round(data.net_up)+' KB/s';
  cpuSpark.push(data.cpu);
  ramSpark.push(data.ram);
}
setInterval(pollStats, 1500); pollStats();

/* ============================================================
   VOICE BUBBLE STATE MACHINE
============================================================ */
const core = document.getElementById('core');
const statusLabel = document.getElementById('statusLabel');
const idleIcon = document.getElementById('idleIcon');
const waveBars = document.getElementById('waveBars');

function setState(state){
  core.classList.remove('listening','speaking','breathe');
  statusLabel.classList.remove('active');
  waveBars.style.display = 'none';
  idleIcon.style.display = 'block';

  if(state === 'idle'){
    core.classList.add('breathe');
    statusLabel.innerHTML = '<span class="dot"></span> IDLE';
  } else if(state === 'listening'){
    core.classList.add('listening');
    statusLabel.classList.add('active');
    statusLabel.innerHTML = '<span class="dot"></span> LISTENING';
  } else if(state === 'thinking'){
    statusLabel.classList.add('active');
    statusLabel.innerHTML = '<span class="dot"></span> PROCESSING';
  } else if(state === 'speaking'){
    core.classList.add('speaking');
    statusLabel.classList.add('active');
    statusLabel.innerHTML = '<span class="dot"></span> SPEAKING';
    idleIcon.style.display = 'none';
    waveBars.style.display = 'flex';
    animateWave();
  }
}

let waveAnim;
function animateWave(){
  const bars = waveBars.querySelectorAll('span');
  clearInterval(waveAnim);
  waveAnim = setInterval(()=>{
    bars.forEach(b=>{
      const h = 5 + Math.random()*26;
      b.style.height = h+'px';
    });
  }, 110);
}
function stopWave(){ clearInterval(waveAnim); }

/* ============================================================
   VOICE RECORDING — MediaRecorder -> /api/voice -> playback
============================================================ */
let mediaRecorder, audioChunks = [], isListening = false;

async function startRecording(){
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  mediaRecorder = new MediaRecorder(stream);
  audioChunks = [];
  mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
  mediaRecorder.start();
  isListening = true;
  setState('listening');
  addLog('mic', 'Listening…');
}

async function stopRecording(){
  if(!mediaRecorder) return;
  isListening = false;
  setState('thinking');
  addLog('system', 'Transcribing & thinking…');

  mediaRecorder.stop();
  await new Promise(res => mediaRecorder.onstop = res);
  mediaRecorder.stream.getTracks().forEach(t => t.stop());

  const blob = new Blob(audioChunks, { type: 'audio/webm' });
  const form = new FormData();
  form.append('file', blob, 'utterance.webm');

  try {
    const res = await fetch('/api/voice', { method: 'POST', body: form });
    const data = await res.json();

    if(!data.text){
      addLog('system', 'Heard nothing.');
      setState('idle');
      return;
    }

    addMessage('user', data.text);
    addLog('mic', `Heard: "${data.text}"`);
    addMessage('assistant', data.reply);

    setState('speaking');
    if(data.audio_b64){
      const audioEl = new Audio('data:audio/wav;base64,' + data.audio_b64);
      audioEl.onended = () => { setState('idle'); stopWave(); };
      audioEl.play();
    } else {
      setTimeout(()=>{ setState('idle'); stopWave(); }, 1500);
    }
  } catch(err){
    addLog('system', 'Error: ' + err.message);
    setState('idle');
  }
}

function toggleTalk(){
  if(!isListening) startRecording();
  else stopRecording();
}
core.addEventListener('click', toggleTalk);
window.addEventListener('keydown', (e)=>{
  if(e.code === 'Space' && e.target === document.body){
    e.preventDefault();
    toggleTalk();
  }
});

/* ============================================================
   ACTIVITY LOG + TRANSCRIPT helpers (called by backend wiring)
============================================================ */
function addLog(type, text){
  const list = document.getElementById('logList');
  const el = document.createElement('div');
  el.className = 'log-entry mono' + (type==='tool' ? ' tool' : '');
  const label = type === 'tool' ? 'TOOL CALL' : type.toUpperCase();
  el.innerHTML = `<span class="t">${label} · ${new Date().toLocaleTimeString()}</span>${text}`;
  list.prepend(el);
}

function addMessage(role, text){
  const wrap = document.getElementById('transcript');
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.innerHTML = `<div class="who">${role === 'user' ? 'YOU' : 'MOUNIR'}</div><div class="body">${text}</div>`;
  wrap.appendChild(el);
}

setState('idle');
</script>

</body>
</html>
