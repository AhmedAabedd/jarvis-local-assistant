<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOUNIR — Agent Studio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  :root {
    --bg:        #0b0a10;
    --bg-panel:  #110f18;
    --bg-elev:   #16131f;
    --line:      #232030;
    --purple:    #a855f7;
    --purple-dim:#7c43c2;
    --soft:      rgba(168,85,247,0.13);
    --glow:      rgba(168,85,247,0.40);
    --lav:       #c4b5fd;
    --text:      #ece9f3;
    --text-mid:  #9b95ad;
    --text-dim:  #635d73;
    --ok:        #5fb487;
    --warn:      #e07a4a;
    --danger:    #ff6b6b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    height: 100%;
    overflow: hidden;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ---- layout ---- */
  .app-layout {
    display: flex;
    height: 100vh;
  }

  /* ---- sidebar ---- */
  .sidebar {
    width: 220px;
    min-width: 220px;
    background: var(--bg-panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
  }
  .sidebar-brand {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--line);
  }
  .sidebar-brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--purple); box-shadow: 0 0 12px var(--glow);
  }
  .sidebar-brand .name { font-size: 16px; font-weight: 700; letter-spacing: 0.25em; }
  .sidebar-brand .sub { font-size: 10px; color: var(--text-dim); letter-spacing: 0.06em; }

  .nav { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 10px;
    border: none; background: transparent;
    color: var(--text-mid); font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all .15s; text-align: left;
  }
  .nav-item .ico { width: 17px; height: 17px; flex: 0 0 17px; }
  .nav-item:hover { color: var(--text); background: var(--bg-elev); }
  .nav-item.active { background: var(--soft); color: var(--lav); }
  .sidebar-footer {
    margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 4px;
  }
  .sidebar-footer .nav-item { width: 100%; }
  .sidebar-footer a {
    color: var(--text-mid); text-decoration: none;
    display: flex; align-items: center; gap: 10px; padding: 10px;
    border: 1px solid transparent; border-radius: 11px;
    transition: color .15s, background .15s, border-color .15s;
  }
  .sidebar-footer a:hover { color: var(--lav); background: var(--bg-elev); border-color: var(--line); }
  .sidebar-footer .back-icon {
    width: 30px; height: 30px; flex: 0 0 30px; display: grid; place-items: center;
    border-radius: 9px; background: var(--soft); color: var(--lav);
  }
  .sidebar-footer .back-copy { min-width: 0; }
  .sidebar-footer strong { display: block; font-size: 11px; font-weight: 600; color: var(--text); }
  .sidebar-footer small { display: block; margin-top: 2px; font-size: 9px; color: var(--text-dim); }

  /* ---- heartbeat ---- */
  .heartbeat-view { max-width: 820px; display: flex; flex-direction: column; gap: 14px; }
  .heartbeat-card {
    padding: 22px; border: 1px solid var(--line);
    border-radius: 16px; background: var(--bg-panel);
    display: grid; grid-template-columns: minmax(0, 1fr) auto;
    align-items: center; gap: 14px 24px;
  }
  .heartbeat-info { display: flex; align-items: flex-start; gap: 14px; min-width: 0; }
  .heartbeat-icon {
    width: 40px; height: 40px; flex: 0 0 40px; border-radius: 12px;
    display: grid; place-items: center; color: var(--lav); background: var(--soft);
  }
  .heartbeat-info h3 { margin: 1px 0 6px; font-size: 14px; font-weight: 600; }
  .heartbeat-info p { margin: 0; color: var(--text-dim); font-size: 12px; line-height: 1.6; }
  .heartbeat-control { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
  .heartbeat-state { font-size: 11px; font-weight: 600; color: var(--text-dim); }
  .heartbeat-state.enabled { color: var(--ok); }
  .heartbeat-toggle-feedback {
    display: none; grid-column: 1 / -1; padding-top: 12px;
    border-top: 1px solid var(--line); color: var(--danger);
    font-size: 10px; line-height: 1.5;
  }
  .heartbeat-toggle-feedback.show { display: block; }
  .heartbeat-config {
    padding: 22px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--bg-panel); display: flex; flex-direction: column; gap: 20px;
  }
  .heartbeat-config h3 { margin: 0 0 5px; font-size: 13px; font-weight: 600; }
  .heartbeat-config p { margin: 0; color: var(--text-dim); font-size: 10px; line-height: 1.5; }
  .heartbeat-fields { display: flex; flex-direction: column; gap: 16px; }
  .heartbeat-field { display: flex; flex-direction: column; gap: 7px; }
  .heartbeat-field span { color: var(--text-mid); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .heartbeat-field select, .heartbeat-field textarea {
    width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--bg); color: var(--text); font: inherit; outline: none;
  }
  .heartbeat-field textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
  .heartbeat-field select:focus, .heartbeat-field textarea:focus { border-color: var(--purple); }
  .heartbeat-enable-setting {
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
  }
  .heartbeat-section-divider { height: 1px; background: var(--line); }
  .heartbeat-agent-picker { max-width: 100%; }
  .heartbeat-capabilities { display: flex; flex-direction: column; gap: 10px; }
  .heartbeat-agent {
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg); overflow: hidden;
  }
  .heartbeat-agent-head {
    padding: 10px 12px; display: flex; align-items: center; justify-content: space-between;
    gap: 10px; color: var(--text-mid); font-size: 11px; font-weight: 600;
  }
  .heartbeat-agent-head-actions { display: flex; align-items: center; gap: 12px; }
  .heartbeat-select-all {
    display: inline-flex; align-items: center; gap: 7px; color: var(--text-mid);
    font-size: 9px; font-weight: 500; cursor: pointer;
  }
  .heartbeat-select-all input { width: 14px; height: 14px; accent-color: var(--purple); }
  .heartbeat-agent-tools { border-top: 1px solid var(--line); }
  .heartbeat-tool {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start;
    gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .heartbeat-tool:last-child { border-bottom: 0; }
  .heartbeat-tool:hover { background: var(--bg-elev); }
  .heartbeat-tool.locked { cursor: not-allowed; opacity: .58; }
  .heartbeat-tool input { width: 15px; height: 15px; margin-top: 2px; accent-color: var(--purple); }
  .heartbeat-tool-name { color: var(--lav); font-size: 11px; font-weight: 600; }
  .heartbeat-tool-description { margin-top: 2px; color: var(--text-dim); font-size: 9px; line-height: 1.4; }
  .heartbeat-tool-lock { color: var(--warn); font-size: 9px; white-space: nowrap; }
  .heartbeat-empty {
    padding: 13px; color: var(--text-dim); font-size: 10px; line-height: 1.5;
    border: 1px dashed var(--line); border-radius: 9px;
  }
  .heartbeat-actions { display: flex; align-items: center; gap: 9px; }
  .heartbeat-feedback { min-height: 16px; color: var(--text-dim); font-size: 10px; }
  .heartbeat-feedback.error { color: var(--danger); }
  .heartbeat-feedback.ok { color: var(--ok); }
  .heartbeat-last {
    padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg-panel); display: grid; grid-template-columns: auto 1fr; gap: 10px 14px;
  }
  .heartbeat-last-label { color: var(--text-dim); font-size: 9px; text-transform: uppercase; letter-spacing: .05em; }
  .heartbeat-last-value { color: var(--text-mid); font-size: 10px; line-height: 1.5; overflow-wrap: anywhere; }
  .heartbeat-run-status { font-weight: 600; text-transform: capitalize; }
  .heartbeat-run-status.alert { color: var(--warn); }
  .heartbeat-run-status.quiet { color: var(--ok); }
  .heartbeat-run-status.error { color: var(--danger); }
  .switch { position: relative; width: 42px; height: 24px; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch-track {
    position: absolute; inset: 0; border-radius: 999px; background: var(--bg-elev);
    border: 1px solid var(--line); transition: background .18s, border-color .18s;
  }
  .switch-track::after {
    content: ''; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px;
    border-radius: 50%; background: var(--text-mid); transition: transform .18s, background .18s;
  }
  .switch input:checked + .switch-track { background: var(--purple-dim); border-color: var(--purple); }
  .switch input:checked + .switch-track::after { transform: translateX(18px); background: white; }
  .switch input:focus-visible + .switch-track { outline: 2px solid var(--lav); outline-offset: 2px; }
  .switch input:disabled + .switch-track { opacity: .55; cursor: wait; }

  /* ---- Telegram setup ---- */
  .telegram-view { max-width: 760px; display: flex; flex-direction: column; gap: 14px; }
  .telegram-card {
    padding: 22px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--bg-panel);
  }
  .telegram-status-card {
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }
  .telegram-identity { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .telegram-logo {
    width: 42px; height: 42px; flex: 0 0 42px; display: grid; place-items: center;
    border-radius: 13px; color: #8bc7ff; background: rgba(51,144,236,.12);
    border: 1px solid rgba(51,144,236,.24);
  }
  .telegram-logo img { width: 27px; height: 27px; display: block; }
  .telegram-identity h3 { margin: 0 0 5px; color: var(--text); font-size: 14px; font-weight: 600; }
  .telegram-identity p { margin: 0; color: var(--text-dim); font-size: 10px; line-height: 1.5; }
  .telegram-status {
    display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto;
    color: var(--text-dim); font-size: 10px; font-weight: 600;
  }
  .telegram-status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
  .telegram-status.connected { color: var(--ok); }
  .telegram-status.connected::before { background: var(--ok); box-shadow: 0 0 8px rgba(95,180,135,.45); }
  .telegram-status.error { color: var(--danger); }
  .telegram-status.error::before { background: var(--danger); }
  .telegram-status.connecting, .telegram-status.waiting_pairing, .telegram-status.configured { color: #d7a84b; }
  .telegram-status.connecting::before, .telegram-status.waiting_pairing::before,
  .telegram-status.configured::before { background: #d7a84b; }
  .telegram-section-head { margin-bottom: 17px; }
  .telegram-section-head h3 { margin: 0 0 5px; font-size: 13px; font-weight: 600; }
  .telegram-section-head p { margin: 0; color: var(--text-dim); font-size: 10px; line-height: 1.5; }
  .telegram-enable-row {
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--line);
  }
  .telegram-enable-copy strong { display: block; color: var(--text); font-size: 12px; font-weight: 600; }
  .telegram-enable-copy span { display: block; margin-top: 4px; color: var(--text-dim); font-size: 10px; }
  .telegram-fields { display: flex; flex-direction: column; gap: 15px; }
  .telegram-fields[hidden], .telegram-actions .btn[hidden] { display: none; }
  .telegram-token-state {
    display: flex; align-items: center; gap: 10px; padding: 12px 13px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
    color: var(--text-mid); font-size: 10px;
  }
  .telegram-token-state::before {
    content: ''; width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%;
    background: var(--text-dim);
  }
  .telegram-token-state.configured { color: var(--ok); }
  .telegram-token-state.configured::before {
    background: var(--ok); box-shadow: 0 0 8px rgba(95,180,135,.4);
  }
  .telegram-field { display: flex; flex-direction: column; gap: 7px; }
  .telegram-field > span {
    color: var(--text-mid); font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .telegram-field input {
    width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--bg); color: var(--text); font: inherit; outline: none;
  }
  .telegram-field input:focus { border-color: var(--purple); }
  .telegram-field .hint { color: var(--text-dim); font-size: 9px; line-height: 1.5; }
  .telegram-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
  .telegram-feedback { min-height: 16px; margin-top: 10px; color: var(--text-dim); font-size: 10px; }
  .telegram-feedback.error { color: var(--danger); }
  .telegram-feedback.ok { color: var(--ok); }
  .telegram-pair-state {
    padding: 16px; border: 1px solid var(--line); border-radius: 11px; background: var(--bg);
  }
  .telegram-account { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .telegram-account-name { color: var(--text); font-size: 12px; font-weight: 600; }
  .telegram-account-user { margin-top: 3px; color: var(--text-dim); font-size: 10px; }
  .telegram-pair-empty { color: var(--text-dim); font-size: 10px; line-height: 1.6; }
  .telegram-pair-code { text-align: center; }
  .telegram-pair-code-label { color: var(--text-dim); font-size: 10px; }
  .telegram-pair-command {
    display: inline-block; margin: 12px 0 9px; padding: 10px 16px;
    border: 1px solid rgba(51,144,236,.28); border-radius: 10px;
    background: rgba(51,144,236,.09); color: #9bcfff; font-size: 17px; font-weight: 600;
  }
  .telegram-pair-help { color: var(--text-mid); font-size: 10px; line-height: 1.55; }

  /* ---- main ---- */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---- main header ---- */
  .main-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 32px 0;
    flex-shrink: 0;
  }
  .main-header h2 {
    font-size: 20px;
    font-weight: 600;
  }
  .view-subtitle { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  .header-actions { display: flex; gap: 8px; }
  .header-actions .btn { white-space: nowrap; }

  /* ---- content area (list / form) ---- */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 32px 32px;
  }

  /* ---- agent topology overview ---- */
  .overview { width: 100%; height: 100%; margin: 0; display: flex; flex-direction: column; }
  .overview-stats {
    display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr));
    gap: 10px; margin-bottom: 16px;
  }
  .overview-stat {
    padding: 13px 15px; border: 1px solid var(--line); border-radius: 12px;
    background: rgba(17,15,24,.76);
  }
  .overview-stat strong { display: block; font: 600 18px 'JetBrains Mono', monospace; color: var(--text); }
  .overview-stat span { display: block; color: var(--text-dim); font-size: 10px; margin-top: 3px; text-transform: uppercase; letter-spacing: .08em; }
  .workflow-shell {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
    background: var(--bg-panel); box-shadow: 0 18px 60px rgba(0,0,0,.18);
  }
  .workflow-toolbar {
    min-height: 48px; padding: 0 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    background: rgba(22,19,31,.72);
  }
  .workflow-title { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 600; }
  .workflow-title .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 9px rgba(95,180,135,.48); }
  .workflow-tools { display: flex; align-items: center; gap: 14px; }
  .workflow-legend { display: flex; gap: 14px; color: var(--text-dim); font-size: 10px; }
  .workflow-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend-dot { width: 7px; height: 7px; border-radius: 2px; background: var(--purple); }
  .legend-dot.dynamic { background: #5b9cf5; }
  .legend-dot.input { border-radius: 50%; background: #5fb487; }
  .zoom-controls {
    display: flex; align-items: center; overflow: hidden;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
  }
  .zoom-control {
    height: 28px; min-width: 30px; padding: 0 8px; border: 0;
    border-right: 1px solid var(--line); background: transparent;
    color: var(--text-mid); font-family: inherit; cursor: pointer;
  }
  .zoom-control:last-child { border-right: 0; }
  .zoom-control:hover { color: var(--lav); background: var(--soft); }
  .zoom-control.value { min-width: 52px; font: 9px 'JetBrains Mono', monospace; }
  .workflow-canvas {
    position: relative; flex: 1; min-height: 330px; overflow: auto;
    display: flex; align-items: center; align-items: safe center; cursor: grab;
    background-color: #0e0c14;
    background-image: radial-gradient(rgba(155,149,173,.18) .8px, transparent .8px);
    background-size: 22px 22px;
  }
  .workflow-canvas.is-panning { cursor: grabbing; user-select: none; }
  .workflow-stage {
    position: relative; flex: 0 0 auto; width: max-content; min-width: 100%; height: 100%; min-height: 330px;
    padding: 32px 28px 38px; display: flex; flex-direction: column; justify-content: center;
  }
  .workflow-links { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: visible; }
  .workflow-links path { fill: none; stroke: #403752; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .workflow-links .specialist-link { stroke-dasharray: 6 6; }
  .workflow-links .input-link { stroke: #4c7d66; stroke-width: 1.5; opacity: .72; }
  .workflow-links marker path { fill: #4c7d66; stroke: none; opacity: .78; }
  .workflow-links circle { fill: #6b5a82; }
  .supervisor-wrap { position: relative; z-index: 2; display: flex; justify-content: center; margin-bottom: 112px; }
  .agent-grid {
    position: relative; z-index: 2; display: flex; justify-content: center; gap: 14px;
  }
  .agent-node {
    position: relative; width: 158px; min-width: 158px; padding: 11px; border: 1px solid #302a3d; border-radius: 11px;
    background: rgba(22,19,31,.96); box-shadow: 0 8px 25px rgba(0,0,0,.22);
    transition: border-color .16s, box-shadow .16s;
  }
  .agent-node.dynamic { cursor: pointer; border-color: rgba(91,156,245,.30); }
  .agent-node.dynamic:hover { border-color: rgba(91,156,245,.72); box-shadow: 0 10px 28px rgba(0,0,0,.28); }
  .agent-node.builtin { cursor: pointer; }
  .agent-node.builtin:hover { border-color: rgba(168,85,247,.58); box-shadow: 0 10px 28px rgba(0,0,0,.28); }
  .node-open {
    position: absolute; top: 9px; right: 9px; color: #78aef8;
    opacity: .55; transition: opacity .15s;
  }
  .agent-node.dynamic:hover .node-open { opacity: 1; }
  .agent-node.supervisor {
    width: 210px; min-width: 210px; border-color: rgba(168,85,247,.58);
    background: linear-gradient(145deg, #241832, #16131f);
    box-shadow: 0 10px 36px rgba(89,42,132,.2); cursor: pointer;
  }
  .agent-node.supervisor:hover { border-color: rgba(190,125,255,.9); box-shadow: 0 12px 38px rgba(89,42,132,.3); }
  .agent-node.telegram-node {
    position: absolute; left: calc(50% - 342px); top: 50%; z-index: 2;
    width: 66px; min-width: 66px; height: 66px; padding: 8px;
    transform: translate(-50%, -50%); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px; cursor: pointer;
    border-color: rgba(95,180,135,.48); background: rgba(22,19,31,.96);
  }
  .agent-node.telegram-node:hover {
    border-color: rgba(95,180,135,.9); box-shadow: 0 10px 30px rgba(95,180,135,.13);
  }
  .telegram-node img { width: 40px; height: 40px; display: block; }
  .telegram-node-label {
    position: absolute; top: calc(100% + 7px); left: 50%; transform: translateX(-50%);
    color: #7fcca4; font-size: 9px; font-weight: 600; white-space: nowrap;
  }
  .node-head { display: flex; align-items: center; gap: 9px; }
  .node-icon {
    width: 30px; height: 30px; flex: 0 0 30px; border-radius: 9px;
    display: grid; place-items: center; color: var(--lav);
    background: var(--soft); border: 1px solid rgba(168,85,247,.25);
    font-size: 11px; font-weight: 700;
  }
  .node-icon.has-image { padding: 0; overflow: visible; }
  .node-icon.has-image img { width: 100%; height: 100%; display: block; object-fit: contain; }
  .dynamic .node-icon { color: #99c2ff; background: rgba(91,156,245,.12); border-color: rgba(91,156,245,.25); }
  .dynamic .node-icon.has-image { background: transparent; border: 0; border-radius: 0; }
  .node-identity { min-width: 0; flex: 1; }
  .node-kind { color: var(--text-dim); font-size: 7px; text-transform: uppercase; letter-spacing: .1em; }
  .node-name { margin-top: 1px; color: var(--text); font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node-model {
    display: flex; align-items: center; gap: 5px; margin-top: 9px;
    color: var(--text-dim); font: 9px 'JetBrains Mono', monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .node-model svg { flex: 0 0 11px; }
  .node-port {
    position: absolute; left: 50%; width: 9px; height: 9px; border-radius: 50%;
    background: #18141f; border: 2px solid #6b5a82; transform: translateX(-50%);
  }
  .node-port.output { bottom: -5px; }
  .node-port.input { top: -5px; }
  .node-port.input-left { left: -5px; top: 50%; transform: translateY(-50%); border-color: #6b5a82; }
  .node-port.output-right { left: auto; right: -5px; top: 50%; transform: translateY(-50%); border-color: #4c7d66; }

  /* ---- list view ---- */
  .list-view { display: flex; flex-direction: column; gap: 0; }
  .empty-state { color: var(--text-dim); font-size: 13px; padding: 32px 0; text-align: center; }

  .list-item {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background .12s;
    gap: 12px;
  }
  .list-item:first-child { border-top: 1px solid var(--line); }
  .list-item:hover { background: var(--bg-elev); }
  .list-item .info { flex: 1; min-width: 0; }
  .list-item .info .primary {
    font-size: 14px; font-weight: 500; color: var(--lav);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .list-item .info .secondary {
    font-size: 12px; color: var(--text-mid); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .list-item .badge {
    font-size: 11px; color: var(--text-dim);
    padding: 2px 10px; border-radius: 6px; border: 1px solid var(--line);
    white-space: nowrap;
  }
  .list-item .del-btn {
    background: none; border: none; color: var(--text-dim);
    font-size: 16px; cursor: pointer; padding: 4px 6px; border-radius: 6px;
    opacity: 0; transition: all .12s;
  }
  .list-item:hover .del-btn { opacity: 0.6; }
  .list-item .del-btn:hover { opacity: 1; color: var(--danger); }
  .list-agent-icon {
    width: 32px; height: 32px; flex: 0 0 32px; display: block; object-fit: contain;
  }
  .list-agent-icon.fallback {
    display: grid; place-items: center; border: 1px solid rgba(91,156,245,.25);
    border-radius: 9px; color: #99c2ff; background: rgba(91,156,245,.10);
    font-size: 11px; font-weight: 700;
  }

  /* ---- form view ---- */
  .form-view { max-width: 640px; }
  .form-view.server-form-view {
    max-width: none; display: grid; grid-template-columns: minmax(0, 640px) minmax(280px, 1fr);
    gap: 18px; align-items: start;
  }
  .server-form-main { min-width: 0; }
  .form-view .form-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    border: 1px solid var(--line); border-radius: 12px; padding: 20px;
    background: var(--bg-panel); margin-top: 4px;
  }
  .form-view .form-grid .full { grid-column: 1 / -1; }
  .form-view .form-grid label {
    display: flex; flex-direction: column; gap: 6px;
    font-size: 11px; color: var(--text-mid); text-transform: uppercase; letter-spacing: 0.06em;
  }
  .form-view .form-grid input,
  .form-view .form-grid textarea,
  .form-view .form-grid select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; color: var(--text); font-family: inherit; font-size: 13px;
    outline: none; resize: vertical;
  }
  .form-view .form-grid input:focus,
  .form-view .form-grid textarea:focus,
  .form-view .form-grid select:focus { border-color: var(--purple-dim); }
  .form-view .form-grid .hint {
    font-size: 10px; color: var(--text-dim); text-transform: none; letter-spacing: 0;
  }
  .form-view .form-grid .api-key-wrap { position: relative; }
  .form-view .form-grid .api-key-wrap input { width: 100%; }

  /* ---- record details (read mode) ---- */
  .record-view { max-width: 760px; display: flex; flex-direction: column; gap: 16px; }
  .record-view.server-record-view {
    max-width: none; display: grid; grid-template-columns: minmax(0, 760px) minmax(280px, 1fr);
    gap: 18px; align-items: start;
  }
  .record-main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .record-card {
    border: 1px solid var(--line); border-radius: 12px; padding: 20px;
    background: var(--bg-panel);
  }
  .record-card-title {
    margin-bottom: 16px; color: var(--text); font-size: 13px; font-weight: 600;
  }
  .record-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; }
  .record-field { min-width: 0; }
  .record-field.full { grid-column: 1 / -1; }
  .record-label {
    margin-bottom: 6px; color: var(--text-dim); font-size: 10px;
    text-transform: uppercase; letter-spacing: .07em;
  }
  .record-value {
    color: var(--text); font-size: 13px; line-height: 1.6;
    overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .record-value.muted { color: var(--text-dim); font-style: italic; }
  .record-value.mono { font-size: 12px; }
  .record-long-text {
    padding: 14px 15px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--bg); color: var(--text-mid); font-size: 12px;
    line-height: 1.7; overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .record-long-text.muted { color: var(--text-dim); font-style: italic; }
  .record-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .record-chip {
    padding: 5px 9px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--bg); color: var(--text-mid); font-size: 11px;
    overflow-wrap: anywhere;
  }
  .record-agent-heading { display: flex; align-items: center; gap: 14px; }
  .record-agent-icon {
    width: 48px; height: 48px; flex: 0 0 48px; display: grid; place-items: center;
    border: 1px solid rgba(91,156,245,.28); border-radius: 12px;
    background: rgba(91,156,245,.10); color: #99c2ff; font-size: 15px; font-weight: 700;
  }
  .record-agent-icon.has-image { border: 0; border-radius: 0; background: transparent; }
  .record-agent-icon img { width: 100%; height: 100%; display: block; object-fit: contain; }
  .record-agent-name { color: var(--text); font-size: 16px; font-weight: 600; }
  .record-secret-status { display: inline-flex; align-items: center; gap: 7px; }
  .record-secret-status::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
  }
  .credential-box {
    grid-column: 1 / -1; border: 1px solid var(--line); border-radius: 9px;
    padding: 12px; background: var(--bg); display: flex; flex-direction: column; gap: 9px;
  }
  .credential-title {
    font-size: 11px; color: var(--text-mid); text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .credential-row { display: grid; grid-template-columns: 1fr 1.5fr auto; gap: 8px; }
  .credential-row input { min-width: 0; }
  .credential-auth-fields {
    display: flex; flex-direction: column; gap: 10px;
  }
  .credential-auth-fields label { min-width: 0; }
  .credential-remove {
    width: 38px; border: 1px solid var(--line); border-radius: 8px;
    color: var(--danger); background: transparent; cursor: pointer; font-size: 18px;
  }
  .credential-add { align-self: flex-start; padding: 7px 12px; }
  .credential-empty { color: var(--text-dim); font-size: 11px; }
  .server-setup {
    grid-column: 1 / -1; border-color: rgba(168,85,247,.3);
    background: linear-gradient(135deg, rgba(168,85,247,.08), var(--bg));
  }
  .server-setup-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .server-setup-status { font-size: 11px; color: var(--text-mid); }
  .server-setup-status.ok { color: var(--ok); }
  .server-setup-status.error { color: var(--danger); }
  .server-setup-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .server-setup-file { display: none; }

  .server-tools-panel {
    position: sticky; top: 0; min-width: 0; max-height: calc(100vh - 128px);
    margin-top: 4px;
    display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg-panel);
  }
  .server-tools-head {
    padding: 16px 18px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; border-bottom: 1px solid var(--line);
  }
  .server-tools-title-row { display: flex; align-items: center; gap: 8px; }
  .server-tools-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .server-tools-subtitle { margin-top: 3px; color: var(--text-dim); font-size: 10px; }
  .server-tools-count {
    min-width: 26px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px;
    color: var(--lav); background: var(--soft); font-size: 10px; text-align: center;
  }
  .server-tools-meta { display: flex; align-items: center; gap: 8px; }
  .connection-status {
    display: inline-flex; align-items: center; gap: 6px; color: var(--text-dim);
    font-size: 10px; font-weight: 600; white-space: nowrap;
  }
  .connection-status::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim);
  }
  .connection-status.connected { color: var(--ok); }
  .connection-status.connected::before { background: var(--ok); box-shadow: 0 0 7px rgba(95,180,135,.45); }
  .connection-status.failed { color: var(--danger); }
  .connection-status.failed::before { background: var(--danger); }
  .connection-status.stale { color: #d7a84b; }
  .connection-status.stale::before { background: #d7a84b; }
  .server-list-status { gap: 0; }
  .server-tools-notice {
    margin: 10px 0 2px; padding: 9px 10px; border-radius: 8px;
    color: var(--text-dim); background: var(--bg-elev); font-size: 10px; line-height: 1.45;
  }
  .server-tools-notice.failed { color: var(--danger); background: rgba(224,90,90,.08); }
  .server-tools-notice.stale { color: #d7a84b; background: rgba(215,168,75,.08); }
  .server-tools-list { padding: 6px 18px 14px; overflow-y: auto; }
  .server-tool { padding: 13px 0; border-bottom: 1px solid var(--line); }
  .server-tool:last-child { border-bottom: 0; }
  .server-tool-name { color: var(--lav); font-size: 13px; font-weight: 600; }
  .server-tool-description { margin-top: 5px; color: var(--text-mid); font-size: 12px; line-height: 1.5; }
  .server-tools-state { padding: 28px 18px; color: var(--text-dim); font-size: 12px; line-height: 1.55; }
  .server-tools-state strong { display: block; margin-bottom: 5px; color: var(--text-mid); font-size: 13px; }
  .server-tools-state.loading { color: var(--text-mid); }
  .server-list-status { padding-left: 7px; padding-right: 7px; }

  .tool-choice-list {
    margin-top: 8px; max-height: 250px; overflow-y: auto;
    border: 1px solid var(--line); border-radius: 9px; background: var(--bg);
  }
  .tool-choice {
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px;
    padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .tool-choice:last-child { border-bottom: 0; }
  .tool-choice:hover { background: var(--bg-elev); }
  .tool-choice input {
    width: 15px; height: 15px; margin-top: 3px; padding: 0;
    border-radius: 4px; accent-color: var(--purple);
  }
  .tool-choice-name { display: block; color: var(--lav); font-size: 12px; font-weight: 600; }
  .tool-choice-description {
    margin-top: 3px; color: var(--text-dim); font-size: 10px; line-height: 1.45;
  }
  .tool-choice.missing { opacity: .7; }
  .tool-choice-empty {
    padding: 13px; color: var(--text-dim); font-size: 11px; line-height: 1.5;
  }

  .agent-icon-field {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 14px;
    padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg);
  }
  .agent-icon-preview {
    width: 48px; height: 48px; flex: 0 0 48px; display: grid; place-items: center;
    overflow: hidden; padding: 7px; border: 1px solid rgba(91,156,245,.28);
    border-radius: 12px; background: rgba(91,156,245,.10); color: #99c2ff;
    font-size: 15px; font-weight: 700;
  }
  .agent-icon-preview img { width: 100%; height: 100%; display: block; object-fit: contain; }
  .agent-icon-copy { flex: 1; min-width: 0; }
  .agent-icon-title { color: var(--text-mid); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .agent-icon-hint { margin-top: 4px; color: var(--text-dim); font-size: 10px; line-height: 1.4; }
  .agent-icon-actions { margin-top: 9px; display: flex; flex-wrap: wrap; gap: 7px; }
  .agent-icon-actions .btn { padding: 6px 10px; font-size: 11px; }
  .agent-icon-input { display: none; }

  .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }

  /* ---- shared ---- */
  .btn {
    padding: 9px 18px; border-radius: 9px; border: 1px solid var(--line);
    font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
    background: transparent; color: var(--text-mid); transition: all .15s;
  }
  .btn:hover { color: var(--text); border-color: var(--text-dim); }
  .btn.primary { background: linear-gradient(140deg, var(--purple), var(--purple-dim)); color: #fff; border-color: transparent; }
  .btn.primary:hover { box-shadow: 0 0 18px var(--glow); }
  .btn.outline { color: var(--purple); border-color: var(--purple-dim); }
  .btn.outline:hover { background: var(--soft); }
  .btn.danger { color: var(--danger); border-color: var(--danger); }
  .btn.danger:hover { color: #fff; background: var(--danger); border-color: var(--danger); }
  .btn:disabled { opacity: 0.4; cursor: default; pointer-events: none; }

  .form-view .form-grid input[readonly],
  .form-view .form-grid textarea[readonly],
  .form-view .form-grid select:disabled {
    opacity: 0.55; cursor: default; pointer-events: none;
  }

  .error { color: var(--danger); font-size: 12px; margin-top: 6px; }
  .success { color: var(--ok); font-size: 12px; margin-top: 6px; }

  /* ---- confirm modal ---- */
  .overlay {
    position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center;
    background: rgba(7,6,11,0.66); backdrop-filter: blur(5px);
  }
  .overlay.show { display: flex; animation: fade .18s ease; }
  @keyframes fade { from{opacity:0} to{opacity:1} }
  .modal-confirm {
    width: min(440px, 92vw); background: var(--bg-panel);
    border: 1px solid var(--line); border-radius: 18px; padding: 26px;
    box-shadow: 0 24px 70px rgba(0,0,0,.6);
    animation: rise .2s ease;
  }
  @keyframes rise { from{transform:translateY(12px); opacity:0} to{transform:translateY(0); opacity:1} }
  .modal-confirm .modal-icon {
    width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(224,122,74,0.13); border: 1px solid rgba(224,122,74,0.3);
    margin-bottom: 16px;
  }
  .modal-confirm .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .modal-confirm .modal-desc { font-size: 13px; color: var(--text-mid); line-height: 1.5; margin-bottom: 22px; }
  .modal-confirm .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

  .modal-builtin {
    position: relative; width: min(620px, 92vw); max-height: min(760px, 88vh);
    overflow-y: auto; background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 18px; padding: 26px; box-shadow: 0 24px 70px rgba(0,0,0,.6);
    animation: rise .2s ease;
  }
  .builtin-modal-close {
    position: absolute; top: 15px; right: 16px; width: 30px; height: 30px;
    border: 1px solid var(--line); border-radius: 9px; background: var(--bg);
    color: var(--text-mid); font-size: 18px; cursor: pointer;
  }
  .builtin-modal-close:hover { color: var(--text); border-color: var(--purple-dim); }
  .builtin-modal-head { display: flex; align-items: center; gap: 13px; padding-right: 34px; }
  .builtin-modal-icon {
    width: 42px; height: 42px; flex: 0 0 42px; display: grid; place-items: center;
    border: 1px solid rgba(168,85,247,.28); border-radius: 12px;
    background: var(--soft); color: var(--lav); font-size: 14px; font-weight: 700;
  }
  .builtin-modal-title { font-size: 16px; font-weight: 600; }
  .builtin-modal-provider { margin-top: 3px; color: var(--text-dim); font-size: 10px; }
  .builtin-modal-description { margin: 17px 0 20px; color: var(--text-mid); font-size: 12px; line-height: 1.6; }
  .builtin-modal-section { margin-top: 19px; }
  .builtin-modal-section h4 {
    margin-bottom: 9px; color: var(--text-mid); font-size: 9px;
    text-transform: uppercase; letter-spacing: .08em;
  }
  .builtin-capability-list { border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
  .builtin-capability {
    padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--bg);
  }
  .builtin-capability:last-child { border-bottom: 0; }
  .builtin-capability strong { display: block; color: var(--lav); font-size: 11px; font-weight: 600; }
  .builtin-capability span { display: block; margin-top: 3px; color: var(--text-dim); font-size: 9px; line-height: 1.45; }
  .builtin-model-select {
    width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--bg); color: var(--text); font: inherit; outline: none;
  }
  .builtin-model-select:focus { border-color: var(--purple); }
  .builtin-model-hint { margin-top: 6px; color: var(--text-dim); font-size: 9px; line-height: 1.5; }
  .builtin-modal-feedback { min-height: 16px; margin-top: 10px; color: var(--danger); font-size: 10px; }
  .builtin-modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; }

  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--purple-dim); }

  @media (max-width: 720px) {
    .sidebar { width: 56px; min-width: 56px; padding: 16px 8px; }
    .sidebar-brand .name, .sidebar-brand .sub,
    .nav-item span:not(.ico),
    .sidebar-footer .back-copy { display: none; }
    .nav-item { justify-content: center; padding: 10px; }
    .sidebar-footer a { justify-content: center; }
    .main-header { padding: 20px 16px 0; flex-direction: column; align-items: stretch; gap: 10px; }
    .content { padding: 16px; }
    .form-view .form-grid { grid-template-columns: 1fr; }
    .record-grid { grid-template-columns: 1fr; }
    .record-field.full { grid-column: 1; }
    .credential-row { grid-template-columns: 1fr; }
    .credential-remove { width: 100%; }
    .header-actions { justify-content: flex-end; }
    .overview-stats { grid-template-columns: 1fr 1fr; }
    .workflow-stage { padding-left: 18px; padding-right: 18px; }
    .workflow-legend { display: none; }
    .heartbeat-card { grid-template-columns: 1fr; align-items: flex-start; }
    .heartbeat-control { align-self: stretch; justify-content: space-between; }
    .heartbeat-toggle-feedback { grid-column: 1; width: 100%; }
    .heartbeat-enable-setting { align-items: flex-start; flex-direction: column; }
    .heartbeat-enable-setting .heartbeat-control { width: 100%; }
    .telegram-status-card, .telegram-enable-row, .telegram-account { align-items: flex-start; flex-direction: column; }
  }
  @media (max-width: 1080px) {
    .form-view.server-form-view { grid-template-columns: 1fr; }
    .record-view.server-record-view { grid-template-columns: 1fr; }
    .server-tools-panel { position: static; max-height: none; margin-top: 0; }
    .server-tools-list { max-height: 440px; }
  }
</style>
</head>

<div class="app-layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="dot"></div>
      <div>
        <div class="name">MOUNIR</div>
        <div class="sub">Agent Studio</div>
      </div>

    <nav class="nav">

        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="8.5" y="14" width="7" height="7" rx="2"/><path d="M6.5 10v1.5a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2V10M12 13.5V14"/></svg>
        <span>Overview</span>
      </button>
      <button class="nav-item" data-tab="models">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
        <span>Models</span>
      </button>
      <button class="nav-item" data-tab="servers">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/></svg>
        <span>MCP Servers</span>
      </button>

        <span>Telegram</span>
      </button>
      <button class="nav-item" data-tab="heartbeat">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.2-6 4.2 12 2.2-6H21"/></svg>
        <span>Heartbeat</span>
      </button>
      <button class="nav-item" data-tab="profile">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>
        <span>Profile</span>
      </button>
      <a href="/" title="Back to Assistant">
        <span class="back-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </span>
        <span class="back-copy"><strong>Back to Assistant</strong><small id="backAssistantName">Return to Mounir</small></span>
      </a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="main-header">
      <div>
        <h2 id="viewTitle">Agent Overview</h2>
        <p class="view-subtitle" id="viewSubtitle">How your assistant is connected</p>
      </div>
      <div class="header-actions">
        <button class="btn outline" id="testBtn" style="display:none">Test Connection</button>
        <button class="btn outline" id="modifyBtn" style="display:none">Modify</button>
        <button class="btn danger" id="deleteBtn" style="display:none">Delete</button>
        <button class="btn" id="cancelBtn" style="display:none">Cancel</button>

  </main>
</div>

<script>
/* ========== state ========== */
const S = {
  tab: 'overview',     // 'overview' | 'models' | 'servers' | 'agents'
  view: 'overview',    // 'overview' | 'list' | 'form'
  editing: null,       // null | item object (null = create mode)
  formReadonly: true,  // true when viewing an instance, false when creating/modifying
  overview: { supervisor: {}, builtins: [] },
  heartbeat: { enabled: false },
  telegram: { enabled: false },
  profile: {},
  models: [],
  servers: [],
  agents: [],
  serverToolCache: {},
};
let canvasZoom = 1;
let pendingAgentIcon;
let pendingConfirmationTools = new Set();
let pendingDedupeTools = new Set();
let heartbeatSelectedAgentId = null;
let heartbeatToolSelections = new Set();
let telegramPairPoll = null;
let telegramStatusPoll = null;

const API = {
  overview: '/api/agent-overview',
  heartbeat: { update: () => '/api/heartbeat' },
  telegram: { update: () => '/api/telegram' },
  profile:  { update: () => '/api/profile' },
  models:  { list: '/api/models',  create: '/api/models',  update: id => `/api/models/${id}`,  del: id => `/api/models/${id}` },
  servers: { list: '/api/mcp-servers', create: '/api/mcp-servers', update: id => `/api/mcp-servers/${id}`, del: id => `/api/mcp-servers/${id}` },
  agents:  { list: '/api/subagents',   create: '/api/subagents',   update: id => `/api/subagents/${id}`,   del: id => `/api/subagents/${id}` },
};

const TAB_META = {
  overview: { title: 'Agent Overview', labelSingular: '', subtitle: 'How your assistant is connected' },
  heartbeat: { title: 'Heartbeat', labelSingular: '', subtitle: 'Run safe background checks and surface important updates' },
  telegram: { title: 'Telegram', labelSingular: '', subtitle: 'Use your assistant securely from Telegram' },
  profile: { title: 'Profile', labelSingular: 'Profile', subtitle: 'Who the assistant is and who it works for' },
  models:  { title: 'Models',        labelSingular: 'Model', subtitle: 'Language models used by built-in and dynamic subagents' },
  servers: { title: 'MCP Servers',   labelSingular: 'Server', subtitle: 'External capabilities connected through MCP' },
  agents:  { title: 'Subagents',     labelSingular: 'Subagent', subtitle: 'Dynamic specialists available to the supervisor' },
};

/* ========== helpers ========== */
function esc(s) { return String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function slug(name) { return name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/_+/g,'_').replace(/^_+|_+$/g,''); }
function $(id) { return document.getElementById(id); }

function parseObject(value) {
  if (!value) return {};
  if (typeof value === 'object') return value;
  try {
    const parsed = JSON.parse(value);
    return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
  } catch (_) { return {}; }
}

function parseStringList(value, fallback = []) {
  if (Array.isArray(value)) return value.map(String).filter(Boolean);
  if (!value) return fallback;
  try {
    const parsed = JSON.parse(value);
    return Array.isArray(parsed) ? parsed.map(String).filter(Boolean) : fallback;
  } catch (_) { return fallback; }
}

function credentialRowsHtml(entries, readonly) {
  if (!entries.length) return '<div class="credential-empty">No credentials added.</div>';
  const disabled = readonly ? ' disabled' : '';
  return entries.map(([key, value]) => `
    <div class="credential-row" data-credential-row>
      <input type="text" data-credential-key value="${esc(key)}" placeholder="Credential name"${readonly ? ' readonly' : ''}>
      <input type="password" data-credential-value value="${esc(value)}" placeholder="Secret value"${readonly ? ' readonly' : ''}>
      <button type="button" class="credential-remove" data-credential-remove title="Remove credential"${disabled}>×</button>
    </div>`).join('');
}

function remoteAuthFromHeaders(headers, savedScheme = '') {
  const entries = Object.entries(headers);
  const empty = {
    mode: 'none', method: 'bearer', secret: '', header: 'X-API-Key'
  };
  if (!entries.length) return empty;
  if (savedScheme === 'custom') return { ...empty, mode: 'custom' };
  if (entries.length === 1 && entries[0][0].toLowerCase() === 'authorization') {
    const match = String(entries[0][1]).match(/^Bearer\s+(.+)$/i);
    if (match) {
      return {
        mode: 'credential', method: 'bearer', secret: match[1], header: 'X-API-Key'
      };
    }
  }
  if (entries.length === 1) {
    return {
      mode: 'credential', method: 'header', secret: entries[0][1], header: entries[0][0]
    };
  }
  return { ...empty, mode: 'custom' };
}

function items() {
  if (S.tab === 'models') return S.models;
  if (S.tab === 'servers') return S.servers;
  return S.agents;
}

/* ========== API ========== */
async function api(method, url, body) {
  const opts = { method, headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `${method} ${url} failed`);
  return data;
}

async function loadAll() {
  const [o, h, t, p, m, s, a] = await Promise.all([
    api('GET', API.overview),
    api('GET', '/api/heartbeat'),
    api('GET', '/api/telegram'),
    api('GET', '/api/profile'),
    api('GET', API.models.list),
    api('GET', API.servers.list),
    api('GET', API.agents.list),
  ]);
  S.overview = o;
  S.heartbeat = h;
  S.telegram = t;
  S.profile = p;
  S.models = m;
  S.servers = s;
  S.agents = a;
  const assistantName = p.assistant_name || 'Mounir';
  document.title = `${assistantName} Agent Studio`;
  $('backAssistantName').textContent = `Return to ${assistantName}`;
}

/* ========== rendering ========== */
function render() {
  if (S.tab === 'overview') renderOverview();
  else if (S.tab === 'heartbeat') renderHeartbeat();
  else if (S.tab === 'telegram') renderTelegram();
  else if (S.tab === 'profile') renderForm();
  else if (S.view === 'list') renderList();
  else renderForm();
  updateHeader();
}

function updateHeader() {
  const meta = TAB_META[S.tab];
  const inOverview = S.tab === 'overview';
  const inHeartbeat = S.tab === 'heartbeat';
  const inTelegram = S.tab === 'telegram';
  const inProfile = S.tab === 'profile';
  const inForm = S.view === 'form';
  const editing = inForm && S.editing;
  $('viewTitle').textContent = inProfile
    ? meta.title
    : editing
    ? meta.labelSingular + ' — ' + S.editing.name
    : meta.title;
  $('viewSubtitle').textContent = meta.subtitle;
  // Create New: only in list view
  $('createBtn').style.display = (inOverview || inHeartbeat || inTelegram || inProfile || inForm) ? 'none' : '';
  // Delete: only in readonly form view
  $('deleteBtn').style.display = (!inOverview && !inProfile && editing && S.formReadonly) ? '' : 'none';
  $('testBtn').style.display = (S.tab === 'servers' && editing && S.formReadonly) ? '' : 'none';
  // Cancel: in form view but NOT in readonly edit mode
  $('cancelBtn').style.display = (inForm && !(editing && S.formReadonly)) ? '' : 'none';
  // Modify / Save / Create button
  if (inOverview || inHeartbeat || inTelegram) {
    $('modifyBtn').style.display = 'none';
    $('cancelBtn').style.display = 'none';
    $('testBtn').style.display = 'none';
  } else if (editing && S.formReadonly) {
    $('modifyBtn').style.display = '';
    $('modifyBtn').className = 'btn outline';
    $('modifyBtn').textContent = 'Modify';
  } else if (inForm) {
    $('modifyBtn').style.display = '';  // editable edit → Save, create → Create
    $('modifyBtn').className = 'btn primary';
    $('modifyBtn').textContent = S.editing ? 'Save' : 'Create';
  } else {
    $('modifyBtn').style.display = 'none';
  }
}

function renderOverview() {
  const supervisor = S.overview.supervisor || {};
  const builtins = S.overview.builtins || [];
  const dynamic = S.agents || [];
  const telegramEnabled = Boolean(S.telegram?.enabled);
  const total = builtins.length + dynamic.length;
  const supervisorInitial = (supervisor.name || 'M').trim().charAt(0).toUpperCase();
  const builtinCards = builtins.map((item, index) => agentNodeHtml(item, 'builtin', `builtin-${index}`)).join('');
  const dynamicCards = dynamic.map(item => agentNodeHtml({
    ...item,
    model: item.model || item.model_name,
  }, 'dynamic', `dynamic-${item.id}`, item.id)).join('');

  $('content').innerHTML = `
    <div class="overview">
      <div class="overview-stats">
        <div class="overview-stat"><strong>1</strong><span>Supervisor</span></div>
        <div class="overview-stat"><strong>${total}</strong><span>Specialists</span></div>
        <div class="overview-stat"><strong>${dynamic.length}</strong><span>Dynamic agents</span></div>
        <div class="overview-stat"><strong>${S.servers.length}</strong><span>MCP servers</span></div>
      </div>
      <section class="workflow-shell" aria-label="Agent component topology">
        <div class="workflow-toolbar">
          <div class="workflow-title"><span class="live-dot"></span><span>Configured topology</span></div>
          <div class="workflow-tools">
            <div class="workflow-legend"><span><i class="legend-dot"></i>Built-in</span><span><i class="legend-dot dynamic"></i>Dynamic MCP</span>${telegramEnabled ? '<span><i class="legend-dot input"></i>Input channel</span>' : ''}</div>
            <div class="zoom-controls" aria-label="Graph zoom controls">
              <button class="zoom-control" type="button" data-zoom="out" aria-label="Zoom out">−</button>
              <button class="zoom-control value" type="button" data-zoom="reset" id="zoomValue" aria-label="Reset zoom">100%</button>
              <button class="zoom-control" type="button" data-zoom="in" aria-label="Zoom in">+</button>
            </div>
          </div>
        </div>
        <div class="workflow-canvas" id="workflowCanvas">
          <div class="workflow-stage" id="workflowStage">
            <svg class="workflow-links" id="workflowLinks" aria-hidden="true"></svg>
            <div class="supervisor-wrap">
              ${telegramEnabled ? `<article class="agent-node telegram-node" id="node-telegram" data-open-telegram title="Open Telegram settings" role="button" tabindex="0">
                <span class="node-port output-right"></span>
                <img src="/images/telegram.svg" alt="">
                <span class="telegram-node-label">Telegram</span>
              </article>` : ''}
              <article class="agent-node supervisor" id="node-supervisor" data-open-supervisor title="View Mounir configuration" role="button" tabindex="0">
                ${telegramEnabled ? '<span class="node-port input-left"></span>' : ''}
                <span class="node-port output"></span>
                <div class="node-head">
                  <div class="node-icon">${esc(supervisorInitial)}</div>
                  <div class="node-identity"><div class="node-kind">Supervisor</div><div class="node-name">${esc(supervisor.name || 'Mounir')}</div></div>
                </div>
                <div class="node-model" title="${esc(supervisor.model || 'Not configured')}">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
                  ${esc(supervisor.model || 'Not configured')}
                </div>
              </article>
            </div>
            <div class="agent-grid">${builtinCards}${dynamicCards}</div>
          </div>
        </div>
      </section>
    </div>`;
  $('workflowStage').style.zoom = String(canvasZoom);
  $('zoomValue').textContent = `${Math.round(canvasZoom * 100)}%`;
  S.view = 'overview';
  requestAnimationFrame(drawWorkflowLinks);
}

function stopTelegramPairPolling() {
  if (telegramPairPoll) clearInterval(telegramPairPoll);
  telegramPairPoll = null;
}

function stopTelegramStatusPolling() {
  if (telegramStatusPoll) clearInterval(telegramStatusPoll);
  telegramStatusPoll = null;
}

function startTelegramStatusPolling() {
  if (telegramStatusPoll) return;
  telegramStatusPoll = setInterval(async () => {
    if (S.tab !== 'telegram') {
      stopTelegramStatusPolling();
      return;
    }
    try {
      const latest = await api('GET', '/api/telegram');
      if (latest.connection_status !== 'connecting') {
        stopTelegramStatusPolling();
        S.telegram = latest;
        renderTelegram();
      }
    } catch (_) {}
  }, 1000);
}

function telegramStatusInfo(status) {
  const states = {
    disabled: ['disabled', 'Disabled'],
    needs_token: ['disabled', 'Token required'],
    configured: ['configured', 'Configured'],
    connecting: ['connecting', 'Connecting'],
    waiting_pairing: ['waiting_pairing', 'Waiting for pairing'],
    connected: ['connected', 'Connected'],
    error: ['error', 'Connection error'],
  };
  const [kind, label] = states[status] || states.disabled;
  return { kind, label };
}

function renderTelegram() {
  stopTelegramPairPolling();
  stopTelegramStatusPolling();
  const state = S.telegram || {};
  const enabled = Boolean(state.enabled);
  const configured = Boolean(state.token_configured);
  const paired = Boolean(state.paired);
  const status = telegramStatusInfo(state.connection_status);
  const botName = state.bot_username ? `@${state.bot_username}` : 'Telegram bot';
  const accountName = state.chat_name || (state.chat_username ? `@${state.chat_username}` : 'Paired account');
  const statusDetail = state.last_error
    ? state.last_error
    : status.kind === 'connected'
    ? `${botName} is ready to receive your messages.`
    : status.kind === 'waiting_pairing'
    ? `${botName} is online and waiting for you to pair an account.`
    : !configured
    ? 'Add the token supplied by BotFather to connect your bot.'
    : !enabled
    ? 'Your bot is configured. Enable Telegram whenever you want to use it.'
    : 'Mounir is connecting to Telegram.';
  const pairingHtml = paired ? `
    <div class="telegram-account">
      <div>
        <div class="telegram-account-name">${esc(accountName)}</div>
        <div class="telegram-account-user">${state.chat_username ? '@' + esc(state.chat_username) : 'Telegram account connected'}</div>
      </div>
      <button class="btn danger" type="button" id="telegramDisconnect">Disconnect account</button>
    </div>` : !configured ? `
    <div class="telegram-pair-empty">Save your BotFather token first. Pairing will then connect your personal Telegram account without asking you for a chat ID.</div>` : !enabled ? `
    <div class="telegram-pair-empty">Enable Telegram to start the bot before pairing your account.</div>` : `
    <div class="telegram-pair-empty">
      Generate a temporary code, then send the displayed command to ${esc(botName)} in Telegram.
      The code works once and expires after ten minutes.
      <div class="telegram-actions"><button class="btn primary" type="button" id="telegramPair">Generate pairing code</button></div>
    </div>`;

  $('content').innerHTML = `
    <div class="telegram-view">
      <section class="telegram-card telegram-status-card">
        <div class="telegram-identity">
          <div class="telegram-logo">
            <img src="/images/telegram.svg" alt="">
          </div>
          <div>
            <h3>${esc(botName)}</h3>
            <p>${esc(statusDetail)}</p>
          </div>
        </div>
        <span class="telegram-status ${status.kind}">${esc(status.label)}</span>
      </section>

      <section class="telegram-card">
        <div class="telegram-enable-row">
          <div class="telegram-enable-copy">
            <strong>Enable Telegram</strong>
            <span>Run the bot automatically with the Mounir server.</span>
          </div>
          <div class="heartbeat-control">
            <label class="switch" title="Enable or disable Telegram">
              <input type="checkbox" id="telegramToggle" role="switch" aria-label="Enable Telegram"${enabled ? ' checked' : ''}>
              <span class="switch-track"></span>
            </label>
          </div>
        </div>
        <div class="telegram-section-head">
          <h3>Bot connection</h3>
          <p>Create a bot with BotFather, then paste the token it gives you. The saved token is never displayed again.</p>
        </div>
        <div class="telegram-token-state${configured ? ' configured' : ''}">
          ${configured ? 'Token configured and stored securely' : 'No token configured yet'}
        </div>
        <div class="telegram-fields" id="telegramTokenEditor" hidden>
          <label class="telegram-field" style="margin-top:15px">
            <span>Bot token</span>
            <input type="password" id="telegramToken" autocomplete="new-password" placeholder="${configured ? 'Paste the new token from BotFather' : 'Paste the token from BotFather'}">
            <span class="hint">It usually looks like numbers, a colon, and a secret value.</span>
          </label>
        </div>
        <div class="telegram-actions">
          <button class="btn primary" type="button" id="telegramSaveToken" data-editing="false">${configured ? 'Replace token' : 'Add token'}</button>
          <button class="btn outline" type="button" id="telegramCancelToken" hidden>Cancel</button>
          <button class="btn outline" type="button" id="telegramTest"${configured ? '' : ' disabled'}>Test connection</button>
          ${configured ? '<button class="btn danger" type="button" id="telegramRemoveToken">Remove token</button>' : ''}
        </div>
        <div class="telegram-feedback" id="telegramFeedback"></div>
      </section>

      <section class="telegram-card">
        <div class="telegram-section-head">
          <h3>Personal account</h3>
          <p>Only the paired Telegram chat can talk to your assistant.</p>
        </div>
        <div class="telegram-pair-state" id="telegramPairState">${pairingHtml}</div>
      </section>
    </div>`;
  S.view = 'telegram';
  updateHeader();

  const feedback = $('telegramFeedback');
  const showFeedback = (message, kind = '') => {
    feedback.textContent = message;
    feedback.className = `telegram-feedback${kind ? ' ' + kind : ''}`;
  };
  $('telegramToggle').addEventListener('change', async event => {
    const requested = event.target.checked;
    event.target.disabled = true;
    try {
      S.telegram = await api('PUT', API.telegram.update(), { enabled: requested });
      renderTelegram();
    } catch (error) {
      event.target.checked = !requested;
      event.target.disabled = false;
      showFeedback(error.message, 'error');
    }
  });
  $('telegramSaveToken').addEventListener('click', async () => {
    const tokenInput = $('telegramToken');
    const saveButton = $('telegramSaveToken');
    if (saveButton.dataset.editing !== 'true') {
      saveButton.dataset.editing = 'true';
      $('telegramTokenEditor').hidden = false;
      $('telegramCancelToken').hidden = false;
      saveButton.textContent = configured ? 'Save new token' : 'Save and connect';
      tokenInput.focus();
      showFeedback(configured
        ? 'Paste the replacement token from BotFather.'
        : 'Paste the token supplied by BotFather.');
      return;
    }
    const token = tokenInput.value.trim();
    if (!token) {
      showFeedback(configured ? 'Enter a new token to replace the current one.' : 'Paste the token from BotFather.', 'error');
      return;
    }
    showFeedback('Saving and connecting…');
    try {
      S.telegram = await api('PUT', API.telegram.update(), { bot_token: token, enabled: true });
      S.telegram = await api('POST', '/api/telegram/test');
      renderTelegram();
      $('telegramFeedback').textContent = 'Bot connected successfully.';
      $('telegramFeedback').className = 'telegram-feedback ok';
    } catch (error) {
      S.telegram = await api('GET', '/api/telegram');
      renderTelegram();
      $('telegramFeedback').textContent = error.message;
      $('telegramFeedback').className = 'telegram-feedback error';
    }
  });
  $('telegramCancelToken').addEventListener('click', () => renderTelegram());
  $('telegramTest').addEventListener('click', async () => {
    showFeedback('Testing the Telegram connection…');
    try {
      S.telegram = await api('POST', '/api/telegram/test');
      renderTelegram();
      $('telegramFeedback').textContent = 'Connection successful.';
      $('telegramFeedback').className = 'telegram-feedback ok';
    } catch (error) {
      S.telegram = await api('GET', '/api/telegram');
      renderTelegram();
      $('telegramFeedback').textContent = error.message;
      $('telegramFeedback').className = 'telegram-feedback error';
    }
  });
  $('telegramRemoveToken')?.addEventListener('click', async () => {
    if (!await showConfirm('Remove the Telegram bot token and disconnect the paired account?')) return;
    try {
      S.telegram = await api('DELETE', '/api/telegram/token');
      renderTelegram();
    } catch (error) {
      showFeedback(error.message, 'error');
    }
  });
  $('telegramDisconnect')?.addEventListener('click', async () => {
    if (!await showConfirm('Disconnect this Telegram account?')) return;
    try {
      S.telegram = await api('DELETE', '/api/telegram/pairing');
      renderTelegram();
    } catch (error) {
      showFeedback(error.message, 'error');
    }
  });
  $('telegramPair')?.addEventListener('click', async event => {
    event.target.disabled = true;
    try {
      const pairing = await api('POST', '/api/telegram/pairing-code');
      $('telegramPairState').innerHTML = `
        <div class="telegram-pair-code">
          <div class="telegram-pair-code-label">Send this command to ${esc(botName)}</div>
          <div class="telegram-pair-command mono">${esc(pairing.command)}</div>
          <div class="telegram-pair-help">Waiting for your Telegram message… This page will update automatically.</div>
          <div class="telegram-actions" style="justify-content:center"><button class="btn outline" type="button" id="telegramCopyPair">Copy command</button></div>
        </div>`;
      $('telegramCopyPair').addEventListener('click', async copyEvent => {
        await navigator.clipboard.writeText(pairing.command);
        copyEvent.target.textContent = 'Copied';
      });
      const expiresAt = Date.parse(pairing.expires_at);
      telegramPairPoll = setInterval(async () => {
        if (Date.now() >= expiresAt) {
          stopTelegramPairPolling();
          const help = $('telegramPairState')?.querySelector('.telegram-pair-help');
          if (help) help.textContent = 'This pairing code expired. Generate a new one.';
          return;
        }
        try {
          const latest = await api('GET', '/api/telegram');
          if (latest.paired) {
            S.telegram = latest;
            renderTelegram();
          }
        } catch (_) {}
      }, 2000);
    } catch (error) {
      event.target.disabled = false;
      showFeedback(error.message, 'error');
    }
  });
  if (state.connection_status === 'connecting') startTelegramStatusPolling();
}

function heartbeatAgentKey(agent) {
  return String(agent?.key ?? agent?.id ?? '');
}

function heartbeatToolKey(agentKey, toolName) {
  return JSON.stringify([String(agentKey), String(toolName)]);
}

function heartbeatAgentToolsHtml(agent) {
  if (!agent) return '<div class="heartbeat-empty">No subagents are available yet.</div>';
  const tools = Array.isArray(agent.tools) ? agent.tools : [];
  const agentKey = heartbeatAgentKey(agent);
  const safeTools = tools.filter(tool => !tool.requires_confirmation);
  const allSafeSelected = safeTools.length > 0 && safeTools.every(tool =>
    heartbeatToolSelections.has(heartbeatToolKey(agentKey, tool.name)));
  return `
    <section class="heartbeat-agent">
      <div class="heartbeat-agent-head">
        <span>${esc(agent.name)}</span>
        <div class="heartbeat-agent-head-actions">
          <label class="heartbeat-select-all">
            <input type="checkbox" data-heartbeat-select-all data-agent-key="${esc(agentKey)}"${allSafeSelected ? ' checked' : ''}${safeTools.length ? '' : ' disabled'}>
            <span>Select all safe</span>
          </label>
          <span class="connection-status ${esc(agent.connection_status || 'untested')}">${tools.length} tools</span>
        </div>
      </div>
      <div class="heartbeat-agent-tools">
        ${tools.length ? tools.map(tool => {
          const locked = Boolean(tool.requires_confirmation);
          const selected = heartbeatToolSelections.has(heartbeatToolKey(agentKey, tool.name));
          return `
            <label class="heartbeat-tool${locked ? ' locked' : ''}">
              <input type="checkbox" data-heartbeat-tool data-agent-key="${esc(agentKey)}" data-tool-name="${esc(tool.name)}"${selected && !locked ? ' checked' : ''}${locked ? ' disabled' : ''}>
              <span>
                <span class="heartbeat-tool-name">${esc(readableToolName(tool.name))}</span>
                <span class="heartbeat-tool-description">${esc(tool.description || 'No description provided.')}</span>
              </span>
              ${locked ? '<span class="heartbeat-tool-lock">Needs confirmation</span>' : ''}
            </label>`;
        }).join('') : '<div class="heartbeat-empty">No saved tools. Open this MCP server and test its connection first.</div>'}
      </div>
    </section>`;
}

function syncHeartbeatSelectAll(agent) {
  if (!agent) return;
  const agentKey = heartbeatAgentKey(agent);
  const control = document.querySelector('[data-heartbeat-select-all]');
  if (!control || control.dataset.agentKey !== agentKey) return;
  const safeTools = (agent.tools || []).filter(tool => !tool.requires_confirmation);
  const selectedCount = safeTools.filter(tool =>
    heartbeatToolSelections.has(heartbeatToolKey(agentKey, tool.name))).length;
  control.checked = safeTools.length > 0 && selectedCount === safeTools.length;
  control.indeterminate = selectedCount > 0 && selectedCount < safeTools.length;
}

function renderHeartbeat() {
  const enabled = Boolean(S.heartbeat.enabled);
  const capabilities = Array.isArray(S.heartbeat.capabilities) ? S.heartbeat.capabilities : [];
  heartbeatToolSelections = new Set(
    capabilities.flatMap(agent => (Array.isArray(agent.tools) ? agent.tools : [])
      .filter(tool => tool.selected && !tool.requires_confirmation)
      .map(tool => heartbeatToolKey(heartbeatAgentKey(agent), tool.name)))
  );
  const currentAgentExists = capabilities.some(agent => heartbeatAgentKey(agent) === String(heartbeatSelectedAgentId));
  if (!currentAgentExists) {
    const selectedAgent = capabilities.find(agent => (agent.tools || []).some(tool => tool.selected));
    heartbeatSelectedAgentId = selectedAgent ? heartbeatAgentKey(selectedAgent) : (capabilities[0] ? heartbeatAgentKey(capabilities[0]) : null);
  }
  const selectedAgent = capabilities.find(agent => heartbeatAgentKey(agent) === String(heartbeatSelectedAgentId)) || null;
  const interval = Number(S.heartbeat.interval_minutes || 30);
  const intervalOptions = [5, 15, 30, 60, 180, 360, 720, 1440];
  if (!intervalOptions.includes(interval)) intervalOptions.push(interval);
  intervalOptions.sort((a, b) => a - b);
  const intervalLabel = minutes => minutes < 60
    ? `${minutes} minutes`
    : minutes === 60
    ? '1 hour'
    : minutes < 1440
    ? `${minutes / 60} hours`
    : '1 day';
  const status = S.heartbeat.last_status || 'never';
  const detail = S.heartbeat.last_error || S.heartbeat.last_message || (
    status === 'quiet' ? 'Nothing needed your attention.' : 'No heartbeat check has run yet.'
  );
  $('content').innerHTML = `
    <div class="heartbeat-view">
      <section class="heartbeat-config" aria-labelledby="heartbeatConfigTitle">
        <div class="heartbeat-enable-setting">
          <div class="heartbeat-info">
            <div class="heartbeat-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.2-6 4.2 12 2.2-6H21"/></svg>
            </div>
            <div>
              <h3 id="heartbeatConfigTitle">Enable heartbeat</h3>
              <p>Quiet checks stay silent; important updates appear in your conversation.</p>
            </div>
          </div>
          <div class="heartbeat-control">
            <span class="heartbeat-state${enabled ? ' enabled' : ''}" id="heartbeatState">${enabled ? 'Enabled' : 'Disabled'}</span>
            <label class="switch" title="Enable or disable heartbeat">
              <input type="checkbox" id="heartbeatToggle" role="switch" aria-label="Enable heartbeat"${enabled ? ' checked' : ''}>
              <span class="switch-track"></span>
            </label>
          </div>
        </div>
        <div class="heartbeat-toggle-feedback" id="heartbeatToggleFeedback" role="alert"></div>
        <div class="heartbeat-fields">
          <label class="heartbeat-field">
            <span>Check every</span>
            <select id="heartbeatInterval">
              ${intervalOptions.map(value => `<option value="${value}"${value === interval ? ' selected' : ''}>${intervalLabel(value)}</option>`).join('')}
            </select>
          </label>
          <label class="heartbeat-field">
            <span>What should Mounir watch for?</span>
            <textarea id="heartbeatInstructions" maxlength="2000" placeholder="For example: Tell me about urgent unread email or failed GitHub checks.">${esc(S.heartbeat.instructions || '')}</textarea>
          </label>
        </div>
        <div class="heartbeat-section-divider"></div>
        <div>
          <h3>Allowed checks</h3>
          <p>Choose a subagent, then select the tools heartbeat may use automatically. Tools that require confirmation remain unavailable.</p>
        </div>
        <label class="heartbeat-field heartbeat-agent-picker">
          <span>Subagent</span>
          <select id="heartbeatAgentSelect"${capabilities.length ? '' : ' disabled'}>
            ${capabilities.length
              ? capabilities.map(agent => `<option value="${esc(heartbeatAgentKey(agent))}"${heartbeatAgentKey(agent) === String(heartbeatSelectedAgentId) ? ' selected' : ''}>${esc(agent.name)}</option>`).join('')
              : '<option value="">No subagents available</option>'}
          </select>
        </label>
        <div class="heartbeat-capabilities" id="heartbeatAgentTools">
          ${heartbeatAgentToolsHtml(selectedAgent)}
        </div>
        <div class="heartbeat-actions">
          <button class="btn primary" type="button" id="heartbeatSave">Save settings</button>
          <button class="btn outline" type="button" id="heartbeatRun">Run now</button>
        </div>
        <div class="heartbeat-feedback" id="heartbeatFeedback"></div>
      </section>
      <section class="heartbeat-last" aria-label="Latest heartbeat status">
        <div class="heartbeat-last-label">Last check</div>
        <div class="heartbeat-last-value">${esc(heartbeatTime(S.heartbeat.last_run_at))}</div>
        <div class="heartbeat-last-label">Result</div>
        <div class="heartbeat-last-value"><span class="heartbeat-run-status ${esc(status)}">${esc(status)}</span> · ${esc(detail)}</div>
        <div class="heartbeat-last-label">Next check</div>
        <div class="heartbeat-last-value">${enabled ? esc(heartbeatTime(S.heartbeat.next_run_at)) : 'Disabled'}</div>
      </section>
    </div>`;
  S.view = 'heartbeat';
  updateHeader();
  syncHeartbeatSelectAll(selectedAgent);

  const toggle = $('heartbeatToggle');
  toggle.addEventListener('change', async () => {
    const requested = toggle.checked;
    toggle.disabled = true;
    try {
      S.heartbeat = await api('PUT', API.heartbeat.update(), heartbeatFormPayload(requested));
      renderHeartbeat();
    } catch (error) {
      toggle.checked = !requested;
      const feedback = $('heartbeatToggleFeedback');
      feedback.textContent = error.message;
      feedback.classList.add('show');
    } finally {
      toggle.disabled = false;
    }
  });

  $('heartbeatAgentSelect').addEventListener('change', event => {
    heartbeatSelectedAgentId = event.target.value;
    const agent = capabilities.find(item => heartbeatAgentKey(item) === heartbeatSelectedAgentId) || null;
    $('heartbeatAgentTools').innerHTML = heartbeatAgentToolsHtml(agent);
    syncHeartbeatSelectAll(agent);
  });
  $('heartbeatAgentTools').addEventListener('change', event => {
    const selectAll = event.target.closest('[data-heartbeat-select-all]');
    if (selectAll) {
      const agent = capabilities.find(item => heartbeatAgentKey(item) === selectAll.dataset.agentKey) || null;
      if (!agent) return;
      for (const tool of agent.tools || []) {
        if (tool.requires_confirmation) continue;
        const key = heartbeatToolKey(selectAll.dataset.agentKey, tool.name);
        if (selectAll.checked) heartbeatToolSelections.add(key);
        else heartbeatToolSelections.delete(key);
      }
      $('heartbeatAgentTools').innerHTML = heartbeatAgentToolsHtml(agent);
      syncHeartbeatSelectAll(agent);
      return;
    }
    const input = event.target.closest('[data-heartbeat-tool]');
    if (!input) return;
    const key = heartbeatToolKey(input.dataset.agentKey, input.dataset.toolName);
    if (input.checked) heartbeatToolSelections.add(key);
    else heartbeatToolSelections.delete(key);
    const agent = capabilities.find(item => heartbeatAgentKey(item) === input.dataset.agentKey) || null;
    syncHeartbeatSelectAll(agent);
  });
  $('heartbeatSave').addEventListener('click', () => saveHeartbeatSettings(false));
  $('heartbeatRun').addEventListener('click', () => saveHeartbeatSettings(true));
}

function heartbeatTime(value) {
  if (!value) return 'Never';
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? value : date.toLocaleString();
}

function heartbeatFormPayload(enabled = Boolean(S.heartbeat.enabled)) {
  const selected_tools = [...heartbeatToolSelections].map(key => {
    const [agent_key, tool_name] = JSON.parse(key);
    return { agent_key, tool_name };
  });
  return {
    enabled,
    interval_minutes: Number($('heartbeatInterval').value),
    instructions: $('heartbeatInstructions').value.trim(),
    selected_tools,
  };
}

async function saveHeartbeatSettings(runNow) {
  const feedback = $('heartbeatFeedback');
  const save = $('heartbeatSave');
  const run = $('heartbeatRun');
  save.disabled = true;
  run.disabled = true;
  feedback.className = 'heartbeat-feedback';
  feedback.textContent = runNow ? 'Saving and running the check…' : 'Saving…';
  try {
    const payload = heartbeatFormPayload();
    if (!payload.selected_tools.length) throw new Error('Select at least one tool for heartbeat checks.');
    S.heartbeat = await api('PUT', API.heartbeat.update(), payload);
    if (runNow) S.heartbeat = await api('POST', '/api/heartbeat/run');
    renderHeartbeat();
    const updated = $('heartbeatFeedback');
    updated.textContent = runNow ? 'Check completed.' : 'Settings saved.';
    updated.className = 'heartbeat-feedback ok';
  } catch (error) {
    feedback.textContent = error.message;
    feedback.className = 'heartbeat-feedback error';
  } finally {
    if ($('heartbeatSave')) $('heartbeatSave').disabled = false;
    if ($('heartbeatRun')) $('heartbeatRun').disabled = false;
  }
}
