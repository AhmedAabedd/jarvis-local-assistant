<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOUNIR — Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  :root {
    --bg:        #0b0a10;
    --bg-panel:  #110f18;
    --bg-elev:   #16131f;
    --line:      #232030;
    --purple:    #a855f7;
    --purple-dim:#7c43c2;
    --soft:      rgba(168,85,247,0.13);
    --glow:      rgba(168,85,247,0.40);
    --lav:       #c4b5fd;
    --text:      #ece9f3;
    --text-mid:  #9b95ad;
    --text-dim:  #635d73;
    --ok:        #5fb487;
    --warn:      #e07a4a;
    --danger:    #ff6b6b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    height: 100%;
    overflow: hidden;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ---- layout ---- */
  .app-layout {
    display: flex;
    height: 100vh;
  }

  /* ---- sidebar ---- */
  .sidebar {
    width: 220px;
    min-width: 220px;
    background: var(--bg-panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
  }
  .sidebar-brand {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--line);
  }
  .sidebar-brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--purple); box-shadow: 0 0 12px var(--glow);
  }
  .sidebar-brand .name { font-size: 16px; font-weight: 700; letter-spacing: 0.25em; }
  .sidebar-brand .sub { font-size: 10px; color: var(--text-dim); letter-spacing: 0.06em; }

  .nav { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 10px;
    border: none; background: transparent;
    color: var(--text-mid); font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all .15s; text-align: left;
  }
  .nav-item:hover { color: var(--text); background: var(--bg-elev); }
  .nav-item.active { background: var(--soft); color: var(--lav); }
  .sidebar-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line); }
  .sidebar-footer a {
    color: var(--text-dim); text-decoration: none; font-size: 12px;
    display: flex; align-items: center; gap: 8px; padding: 6px 14px;
    transition: color .15s;
  }
  .sidebar-footer a:hover { color: var(--lav); }

  /* ---- main ---- */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---- main header ---- */
  .main-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 32px 0;
    flex-shrink: 0;
  }
  .main-header h2 {
    font-size: 20px;
    font-weight: 600;
  }
  .header-actions { display: flex; gap: 8px; }
  .header-actions .btn { white-space: nowrap; }

  /* ---- content area (list / form) ---- */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 32px 32px;
  }

  /* ---- list view ---- */
  .list-view { display: flex; flex-direction: column; gap: 0; }
  .empty-state { color: var(--text-dim); font-size: 13px; padding: 32px 0; text-align: center; }

  .list-item {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background .12s;
    gap: 12px;
  }
  .list-item:first-child { border-top: 1px solid var(--line); }
  .list-item:hover { background: var(--bg-elev); }
  .list-item .info { flex: 1; min-width: 0; }
  .list-item .info .primary {
    font-size: 14px; font-weight: 500; color: var(--lav);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .list-item .info .secondary {
    font-size: 12px; color: var(--text-mid); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .list-item .badge {
    font-size: 11px; color: var(--text-dim);
    padding: 2px 10px; border-radius: 6px; border: 1px solid var(--line);
    white-space: nowrap;
  }
  .list-item .del-btn {
    background: none; border: none; color: var(--text-dim);
    font-size: 16px; cursor: pointer; padding: 4px 6px; border-radius: 6px;
    opacity: 0; transition: all .12s;
  }
  .list-item:hover .del-btn { opacity: 0.6; }
  .list-item .del-btn:hover { opacity: 1; color: var(--danger); }

  /* ---- form view ---- */
  .form-view { max-width: 640px; }
  .form-view .form-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    border: 1px solid var(--line); border-radius: 12px; padding: 20px;
    background: var(--bg-panel); margin-top: 4px;
  }
  .form-view .form-grid .full { grid-column: 1 / -1; }
  .form-view .form-grid label {
    display: flex; flex-direction: column; gap: 6px;
    font-size: 11px; color: var(--text-mid); text-transform: uppercase; letter-spacing: 0.06em;
  }
  .form-view .form-grid input,
  .form-view .form-grid textarea,
  .form-view .form-grid select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; color: var(--text); font-family: inherit; font-size: 13px;
    outline: none; resize: vertical;
  }
  .form-view .form-grid input:focus,
  .form-view .form-grid textarea:focus,
  .form-view .form-grid select:focus { border-color: var(--purple-dim); }
  .form-view .form-grid .hint {
    font-size: 10px; color: var(--text-dim); text-transform: none; letter-spacing: 0;
  }
  .form-view .form-grid .api-key-wrap { position: relative; }
  .form-view .form-grid .api-key-wrap input { width: 100%; }

  .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }

  /* ---- shared ---- */
  .btn {
    padding: 9px 18px; border-radius: 9px; border: 1px solid var(--line);
    font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
    background: transparent; color: var(--text-mid); transition: all .15s;
  }
  .btn:hover { color: var(--text); border-color: var(--text-dim); }
  .btn.primary { background: linear-gradient(140deg, var(--purple), var(--purple-dim)); color: #fff; border-color: transparent; }
  .btn.primary:hover { box-shadow: 0 0 18px var(--glow); }
  .btn.outline { color: var(--purple); border-color: var(--purple-dim); }
  .btn.outline:hover { background: var(--soft); }
  .btn.danger { color: var(--danger); border-color: var(--danger); }
  .btn.danger:hover { color: #fff; background: var(--danger); border-color: var(--danger); }
  .btn:disabled { opacity: 0.4; cursor: default; pointer-events: none; }

  .form-view .form-grid input[readonly],
  .form-view .form-grid textarea[readonly],
  .form-view .form-grid select:disabled {
    opacity: 0.55; cursor: default; pointer-events: none;
  }

  .error { color: var(--danger); font-size: 12px; margin-top: 6px; }
  .success { color: var(--ok); font-size: 12px; margin-top: 6px; }

  /* ---- confirm modal ---- */
  .overlay {
    position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center;
    background: rgba(7,6,11,0.66); backdrop-filter: blur(5px);
  }
  .overlay.show { display: flex; animation: fade .18s ease; }
  @keyframes fade { from{opacity:0} to{opacity:1} }
  .modal-confirm {
    width: min(440px, 92vw); background: var(--bg-panel);
    border: 1px solid var(--line); border-radius: 18px; padding: 26px;
    box-shadow: 0 24px 70px rgba(0,0,0,.6);
    animation: rise .2s ease;
  }
  @keyframes rise { from{transform:translateY(12px); opacity:0} to{transform:translateY(0); opacity:1} }
  .modal-confirm .modal-icon {
    width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(224,122,74,0.13); border: 1px solid rgba(224,122,74,0.3);
    margin-bottom: 16px;
  }
  .modal-confirm .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .modal-confirm .modal-desc { font-size: 13px; color: var(--text-mid); line-height: 1.5; margin-bottom: 22px; }
  .modal-confirm .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--purple-dim); }

  @media (max-width: 720px) {
    .sidebar { width: 56px; min-width: 56px; padding: 16px 8px; }
    .sidebar-brand .name, .sidebar-brand .sub,
    .nav-item span:not(.ico),
    .sidebar-footer a span:not(.arrow) { display: none; }
    .nav-item { justify-content: center; padding: 10px; }
    .sidebar-footer a { justify-content: center; }
    .main-header { padding: 20px 16px 0; flex-direction: column; align-items: stretch; gap: 10px; }
    .content { padding: 16px; }
    .form-view .form-grid { grid-template-columns: 1fr; }
    .header-actions { justify-content: flex-end; }
  }
</style>
</head>
<body>

<div class="app-layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="dot"></div>
      <div>
        <div class="name">MOUNIR</div>
        <div class="sub">Admin</div>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-tab="models">Models</button>
      <button class="nav-item" data-tab="servers">MCP Servers</button>
      <button class="nav-item" data-tab="agents">Subagents</button>
    </nav>
    <div class="sidebar-footer">
      <a href="/"><span class="arrow">←</span><span> Dashboard</span></a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="main-header">
      <h2 id="viewTitle">Models</h2>
      <div class="header-actions">
        <button class="btn outline" id="modifyBtn" style="display:none">Modify</button>
        <button class="btn danger" id="deleteBtn" style="display:none">Delete</button>
        <button class="btn" id="cancelBtn" style="display:none">Cancel</button>
        <button class="btn primary" id="createBtn">+ Create New</button>
      </div>
    </div>
    <div class="content" id="content">
      <!-- rendered by JS -->
    </div>
  </main>
</div>

<script>
/* ========== state ========== */
const S = {
  tab: 'models',       // 'models' | 'servers' | 'agents'
  view: 'list',        // 'list' | 'form'
  editing: null,       // null | item object (null = create mode)
  formReadonly: true,  // true when viewing an instance (readonly), false when creating or after clicking Modify
  models: [],
  servers: [],
  agents: [],
};

const API = {
  models:  { list: '/api/models',  create: '/api/models',  update: id => `/api/models/${id}`,  del: id => `/api/models/${id}` },
  servers: { list: '/api/mcp-servers', create: '/api/mcp-servers', update: id => `/api/mcp-servers/${id}`, del: id => `/api/mcp-servers/${id}` },
  agents:  { list: '/api/subagents',   create: '/api/subagents',   update: id => `/api/subagents/${id}`,   del: id => `/api/subagents/${id}` },
};

const TAB_META = {
  models:  { title: 'Models',        labelSingular: 'Model' },
  servers: { title: 'MCP Servers',   labelSingular: 'Server' },
  agents:  { title: 'Subagents',     labelSingular: 'Subagent' },
};

/* ========== helpers ========== */
function esc(s) { return String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function slug(name) { return name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/_+/g,'_').replace(/^_+|_+$/g,''); }
function $(id) { return document.getElementById(id); }

function items() {
  if (S.tab === 'models') return S.models;
  if (S.tab === 'servers') return S.servers;
  return S.agents;
}

/* ========== API ========== */
async function api(method, url, body) {
  const opts = { method, headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `${method} ${url} failed`);
  return data;
}

async function loadAll() {
  const [m, s, a] = await Promise.all([
    api('GET', API.models.list),
    api('GET', API.servers.list),
    api('GET', API.agents.list),
  ]);
  S.models = m;
  S.servers = s;
  S.agents = a;
}

/* ========== rendering ========== */
function render() {
  if (S.view === 'list') renderList();
  else renderForm();
  updateHeader();
}

function updateHeader() {
  const meta = TAB_META[S.tab];
  const inForm = S.view === 'form';
  const editing = inForm && S.editing;
  $('viewTitle').textContent = editing
    ? meta.labelSingular + ' — ' + S.editing.name
    : meta.title;
  // Create New: only in list view
  $('createBtn').style.display = inForm ? 'none' : '';
  // Delete: only in readonly form view
  $('deleteBtn').style.display = (editing && S.formReadonly) ? '' : 'none';
  // Cancel: in form view but NOT in readonly edit mode
  $('cancelBtn').style.display = (inForm && !(editing && S.formReadonly)) ? '' : 'none';
  // Modify / Save / Create button
  if (editing && S.formReadonly) {
    $('modifyBtn').style.display = '';
    $('modifyBtn').className = 'btn outline';
    $('modifyBtn').textContent = 'Modify';
  } else if (inForm) {
    $('modifyBtn').style.display = '';  // editable edit → Save, create → Create
    $('modifyBtn').className = 'btn primary';
    $('modifyBtn').textContent = S.editing ? 'Save' : 'Create';
  } else {
    $('modifyBtn').style.display = 'none';
  }
}

function renderList() {
  const el = $('content');
  const list = items();
  if (!list.length) {
    el.innerHTML = '<div class="empty-state">No ' + TAB_META[S.tab].title.toLowerCase() + ' saved yet.</div>';
    return;
  }
  el.innerHTML = '<div class="list-view">' + list.map(item => renderListItem(item)).join('') + '</div>';
  S.view = 'list';
  updateHeader();
}

function renderListItem(item) {
  if (S.tab === 'models') return `
    <div class="list-item" data-id="${item.id}">
      <div class="info">
        <div class="primary">${esc(item.name)}</div>
        <div class="secondary">${esc(item.model || item.name)}${item.provider ? ' · ' + esc(item.provider) : ''}</div>
      </div>
      <span class="badge">${item.api_key ? 'key set' : 'no key'}</span>
      <button class="del-btn" data-action="delete" title="Remove">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>`;
  if (S.tab === 'servers') return `
    <div class="list-item" data-id="${item.id}">
      <div class="info">
        <div class="primary">${esc(item.name)}</div>
        <div class="secondary mono">${esc(item.connection)}</div>
      </div>
      <button class="del-btn" data-action="delete" title="Remove">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>`;
  return `
    <div class="list-item" data-id="${item.id}">
      <div class="info">
        <div class="primary">${esc(item.name)}</div>
        <div class="secondary">${esc(item.description)}</div>
      </div>
      <span class="badge mono">delegate_to_${slug(item.name)}</span>
      <button class="del-btn" data-action="delete" title="Remove">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>`;
}

function renderForm() {
  const el = $('content');
  const editing = S.editing;
  S.formReadonly = !!editing; // readonly when viewing existing, editable when creating
  el.innerHTML = '<div class="form-view">' + buildFormHtml(editing, S.formReadonly) + '</div>';
  S.view = 'form';
  updateHeader();
  populateSelects();
  attachFormEvents();
}

function buildFormHtml(item, readonly) {
  const e = (field, def) => item ? esc(item[field] ?? '') : (def ?? '');
  const ro = readonly ? ' readonly' : '';
  const dis = readonly ? ' disabled' : '';
  if (S.tab === 'models') return `
    <form class="form-grid" id="formEl">
      <label class="full">Name <input type="text" name="name" value="${e('name')}" placeholder="e.g. Ollama Cloud" required${ro}></label>
      <label class="full">Model ID
        <span class="hint">The actual model identifier sent to the API (e.g. qwen3:4b, gpt-4o). Falls back to Name if empty.</span>
        <input type="text" name="model" value="${e('model')}" placeholder="qwen3:4b"${ro}>
      </label>
      <label class="full">Provider <input type="text" name="provider" value="${e('provider')}" placeholder="e.g. Ollama / OpenAI / Groq"${ro}></label>
      <label class="full">Base URL <input type="text" name="base_url" value="${e('base_url')}" placeholder="https://ollama.com/v1" required${ro}></label>
      <label class="full">API key
        <span class="hint">Use $VAR or \${VAR} to read from env instead of a raw key.</span>
        <input type="text" name="api_key" value="${e('api_key')}" placeholder="$${esc('OLLAMA_API_KEY')}"${ro}>
      </label>
      <div class="full error" id="formError"></div>
    </form>`;
  if (S.tab === 'servers') return `
    <form class="form-grid" id="formEl">
      <label class="full">Name <input type="text" name="name" value="${e('name')}" placeholder="e.g. Brave Search" required${ro}></label>
      <label class="full">Connection
        <span class="hint">stdio command (e.g. npx -y ...) or http(s) SSE URL.</span>
        <input type="text" name="connection" value="${e('connection')}" placeholder="npx -y ... or https://..." required${ro}>
      </label>
      <div class="full error" id="formError"></div>
    </form>`;
  return `
    <form class="form-grid" id="formEl">
      <label class="full">Name
        <span class="hint">Becomes delegate_to_&lt;slug&gt;</span>
        <input type="text" name="name" value="${e('name')}" placeholder="e.g. Web Search" required${ro}>
      </label>
      <label class="full">Description
        <span class="hint">Routing signal — when should the supervisor delegate here.</span>
        <textarea name="description" rows="2" placeholder="Search the web with Brave. Use for any lookup." required${ro}>${e('description')}</textarea>
      </label>
      <label class="full">System prompt
        <textarea name="system_prompt" rows="4" placeholder="The agent's personality and rules. Leave empty for a generic default."${ro}>${e('system_prompt')}</textarea>
      </label>
      <label>Model <select name="model_id" required${dis}></select></label>
      <label>MCP server <select name="mcp_server_id" required${dis}></select></label>
      <div class="full error" id="formError"></div>
    </form>`;
}

function populateSelects() {
  const f = $('formEl');
  if (!f) return;
  const mSel = f.querySelector('select[name="model_id"]');
  const sSel = f.querySelector('select[name="mcp_server_id"]');
  if (mSel) {
    const cur = S.editing ? S.editing.model_id : '';
    mSel.innerHTML = '<option value="">Choose a model…</option>' +
      S.models.map(m => `<option value="${m.id}"${m.id === cur ? ' selected' : ''}>${esc(m.name)} — ${esc(m.provider || 'no provider')}</option>`).join('');
  }
  if (sSel) {
    const cur = S.editing ? S.editing.mcp_server_id : '';
    sSel.innerHTML = '<option value="">Choose an MCP server…</option>' +
      S.servers.map(s => `<option value="${s.id}"${s.id === cur ? ' selected' : ''}>${esc(s.name)}</option>`).join('');
  }
}

function attachFormEvents() {
  const f = $('formEl');
  if (!f) return;
  f.addEventListener('submit', onFormSubmit);
}

/* ========== form submit ========== */
async function onFormSubmit(e) {
  e.preventDefault();
  const f = e.target;
  const errEl = $('formError');
  errEl.textContent = '';
  const data = new FormData(f);
  const body = Object.fromEntries(data.entries());
  // Parse numeric fields for agents
  if (S.tab === 'agents') {
    body.model_id = +body.model_id;
    body.mcp_server_id = +body.mcp_server_id;
  }
  try {
    if (S.editing) {
      await api('PUT', API[S.tab].update(S.editing.id), body);
    } else {
      await api('POST', API[S.tab].create, body);
    }
    await loadAll();
    S.editing = null;
    S.view = 'list';
    render();
  } catch (ex) {
    errEl.textContent = ex.message;
  }
}

/* ========== list events (click item / delete) ========== */
$('content').addEventListener('click', async e => {
  // Delete button
  const delBtn = e.target.closest('[data-action="delete"]');
  if (delBtn) {
    const row = delBtn.closest('.list-item');
    const id = +row.dataset.id;
    const list = items();
    const item = list.find(x => x.id === id);
    if (!item) return;
    if (!await showConfirm(`Remove “${item.name}”?`)) return;
    try {
      await api('DELETE', API[S.tab].del(id));
      await loadAll();
      render();
    } catch (ex) { alert(ex.message); }
    return;
  }
  // Click on a row (edit)
  const row = e.target.closest('.list-item');
  if (!row) return;
  const id = +row.dataset.id;
  const list = items();
  const item = list.find(x => x.id === id);
  if (!item) return;
  S.editing = item;
  renderForm();
});

/* ========== header buttons ========== */
$('createBtn').addEventListener('click', () => {
  S.editing = null;
  renderForm();
});

$('modifyBtn').addEventListener('click', () => {
  const f = $('formEl');
  if (!f) return;
  if (S.formReadonly) {
    // Enable all fields
    f.querySelectorAll('input[readonly], textarea[readonly]').forEach(el => el.removeAttribute('readonly'));
    f.querySelectorAll('select[disabled]').forEach(el => el.removeAttribute('disabled'));
    S.formReadonly = false;
    updateHeader();
  } else {
    if (!f.reportValidity()) return;
    const fakeEvent = { target: f, preventDefault: () => {} };
    onFormSubmit(fakeEvent);
  }
});

/* ========== sidebar navigation ========== */
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    S.tab = btn.dataset.tab;
    S.view = 'list';
    S.editing = null;
    render();
  });
});

/* ========== cancel button ========== */
$('cancelBtn').addEventListener('click', () => {
  S.editing = null;
  S.view = 'list';
  render();
});

/* ========== delete button (readonly form) ========== */
$('deleteBtn').addEventListener('click', async () => {
  if (!S.editing) return;
  if (!await showConfirm(`Delete “${S.editing.name}”? This cannot be undone.`)) return;
  try {
    await api('DELETE', API[S.tab].del(S.editing.id));
    S.editing = null;
    S.view = 'list';
    await loadAll();
    render();
  } catch (ex) { alert(ex.message); }
});

/* ========== init ========== */
async function init() {
  await loadAll();
  render();
}
init();
</script>

<!-- confirm modal -->
<div class="overlay" id="confirmOverlay">
  <div class="modal-confirm">
    <div class="modal-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e07a4a" stroke-width="1.8" stroke-linecap="round">
        <path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>
      </svg>
    </div>
    <div class="modal-title">Remove item?</div>
    <div class="modal-desc" id="confirmMsg"></div>
    <div class="modal-actions">
      <button class="btn" id="confirmCancelBtn">Cancel</button>
      <button class="btn primary" id="confirmOkBtn">Remove</button>
    </div>
  </div>
</div>

<script>
/* ========== confirm modal ========== */
let _confirmResolve = null;
const confirmOverlay = $('confirmOverlay');
const confirmMsg = $('confirmMsg');

function showConfirm(msg) {
  return new Promise(resolve => {
    _confirmResolve = resolve;
    confirmMsg.textContent = msg;
    confirmOverlay.classList.add('show');
  });
}

function closeConfirm(approved) {
  confirmOverlay.classList.remove('show');
  if (_confirmResolve) {
    _confirmResolve(approved);
    _confirmResolve = null;
  }
}

$('confirmOkBtn').addEventListener('click', () => closeConfirm(true));
$('confirmCancelBtn').addEventListener('click', () => closeConfirm(false));
window.addEventListener('keydown', e => {
  if (!confirmOverlay.classList.contains('show')) return;
  if (e.key === 'Enter') closeConfirm(true);
  if (e.key === 'Escape') closeConfirm(false);
});
</script>
</body>
</html>
