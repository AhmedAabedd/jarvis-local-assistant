async function loadAgentToolChoices(resetSelection = false) {
  const select = $('formEl')?.querySelector('select[name="mcp_server_id"]');
  const serverId = +(select?.value || 0);
  if (resetSelection) {
    pendingConfirmationTools.clear();
    pendingDedupeTools.clear();
  }
  if (!serverId) {
    renderConfirmationToolChoices(null);
    renderDedupeToolChoices(null);
    return;
  }
  try {
    const state = S.serverToolCache[serverId]
      || await api('GET', `/api/mcp-servers/${serverId}/tools`);
    S.serverToolCache[serverId] = state;
    renderConfirmationToolChoices(state);
    renderDedupeToolChoices(state);
  } catch (error) {
    for (const id of ['confirmationToolChoices', 'dedupeToolChoices']) {
      const container = $(id);
      if (container) container.innerHTML = `<div class="tool-choice-empty">${esc(error.message)}</div>`;
    }
  }
}

function renderServerSetup(data) {
  const setup = $('serverSetup');
  if (!setup) return;
  const fileActions = Array.isArray(data.file_actions) ? data.file_actions : [];
  const actions = Array.isArray(data.actions) ? data.actions : [];
  const status = data.status || {};
  setup.innerHTML = `
    <div class="server-setup-head">
      <div>
        <div class="credential-title">${esc(data.title || 'Additional setup')}</div>
        <div class="hint">${esc(data.description || '')}</div>
      </div>
      <div class="server-setup-status ${esc(status.kind || '')}">${esc(status.text || '')}</div>
    </div>
    <div class="server-setup-actions">
      ${fileActions.map(action => `
        <input class="server-setup-file" type="file" data-setup-file-input="${esc(action.id)}" accept="${esc(action.accept || '')}">
        <button type="button" class="btn outline" data-setup-file="${esc(action.id)}" data-busy-label="${esc(action.busy_label || 'Working…')}">${esc(action.label || 'Choose file')}</button>
      `).join('')}
      ${actions.map(action => `
        <button type="button" class="btn ${action.style === 'primary' ? 'primary' : 'outline'}" data-setup-action="${esc(action.id)}" data-busy-label="${esc(action.busy_label || 'Working…')}"${action.disabled ? ' disabled' : ''}>${esc(action.label || 'Continue')}</button>
      `).join('')}
    </div>`;
}

function showServerSetupError(message) {
  const setup = $('serverSetup');
  if (!setup) return;
  setup.innerHTML = `
    <div class="server-setup-head">
      <div class="credential-title">Additional setup</div>
      <div class="server-setup-status error">${esc(message)}</div>
    </div>`;
}

async function loadServerSetup() {
  const setup = $('serverSetup');
  if (!setup) return;
  try {
    const data = await api('GET', `/api/mcp-servers/${setup.dataset.serverId}/setup`);
    renderServerSetup(data);
  } catch (error) {
    showServerSetupError(error.message);
  }
}

function attachServerSetupEvents() {
  const setup = $('serverSetup');
  if (!setup) return;
  const serverId = setup.dataset.serverId;
  setup.addEventListener('click', async event => {
    const fileButton = event.target.closest('[data-setup-file]');
    if (fileButton) {
      setup.querySelector(`[data-setup-file-input="${CSS.escape(fileButton.dataset.setupFile)}"]`)?.click();
      return;
    }
    const actionButton = event.target.closest('[data-setup-action]');
    if (!actionButton) return;
    const idleLabel = actionButton.textContent;
    actionButton.disabled = true;
    actionButton.textContent = actionButton.dataset.busyLabel;
    try {
      await api('POST', `/api/mcp-servers/${serverId}/setup/actions/${encodeURIComponent(actionButton.dataset.setupAction)}`);
      await loadServerSetup();
    } catch (error) {
      actionButton.disabled = false;
      actionButton.textContent = idleLabel;
      showServerSetupError(error.message);
    }
  });
  setup.addEventListener('change', async event => {
    const input = event.target.closest('[data-setup-file-input]');
    const file = input?.files?.[0];
    if (!file) return;
    const body = new FormData();
    body.append('file', file);
    const button = setup.querySelector(`[data-setup-file="${CSS.escape(input.dataset.setupFileInput)}"]`);
    if (button) {
      button.disabled = true;
      button.textContent = button.dataset.busyLabel;
    }
    try {
      const response = await fetch(`/api/mcp-servers/${serverId}/setup/files/${encodeURIComponent(input.dataset.setupFileInput)}`, {method: 'POST', body});
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || 'File setup failed.');
      await loadServerSetup();
    } catch (error) {
      showServerSetupError(error.message);
    }
  });
  loadServerSetup();
}

function addCredentialRow(kind) {
  const container = kind === 'headers' ? $('headerRows') : $('environmentRows');
  container.querySelector('.credential-empty')?.remove();
  container.insertAdjacentHTML('beforeend', credentialRowsHtml([['', '']], false));
  container.lastElementChild?.querySelector('[data-credential-key]')?.focus();
}

function collectCredentialRows(containerId, label) {
  const result = {};
  for (const row of $(containerId).querySelectorAll('[data-credential-row]')) {
    const key = row.querySelector('[data-credential-key]').value.trim();
    const value = row.querySelector('[data-credential-value]').value;
    if (!key && !value) continue;
    if (!key) throw new Error(`${label} name is required.`);
    if (!value) throw new Error(`${label} value is required for “${key}”.`);
    if (Object.hasOwn(result, key)) throw new Error(`${label} “${key}” is duplicated.`);
    result[key] = value;
  }
  return result;
}

function attachFormEvents() {
  const f = $('formEl');
  if (!f) return;
  f.addEventListener('submit', onFormSubmit);
  if (S.tab === 'agents') {
    $('confirmationMode').addEventListener('change', updateConfirmationVisibility);
    const serverSelect = f.querySelector('select[name="mcp_server_id"]');
    serverSelect.addEventListener('change', () => loadAgentToolChoices(true));
    $('confirmationToolChoices').addEventListener('change', event => {
      const checkbox = event.target.closest('[data-confirmation-tool]');
      if (!checkbox) return;
      if (checkbox.checked) pendingConfirmationTools.add(checkbox.dataset.confirmationTool);
      else pendingConfirmationTools.delete(checkbox.dataset.confirmationTool);
    });
    $('dedupeToolChoices').addEventListener('change', event => {
      const checkbox = event.target.closest('[data-dedupe-tool]');
      if (!checkbox) return;
      if (checkbox.checked) pendingDedupeTools.add(checkbox.dataset.dedupeTool);
      else pendingDedupeTools.delete(checkbox.dataset.dedupeTool);
    });
    attachAgentIconEvents();
    updateConfirmationVisibility();
    loadAgentToolChoices();
    return;
  }
  if (S.tab !== 'servers') return;
  $('serverTransport').addEventListener('change', updateServerFormVisibility);
  $('remoteAuthMode').addEventListener('change', updateRemoteAuthVisibility);
  $('credentialDelivery').addEventListener('change', updateRemoteAuthVisibility);
  f.addEventListener('click', event => {
    const add = event.target.closest('[data-add-credential]');
    if (add) addCredentialRow(add.dataset.addCredential);
    const remove = event.target.closest('[data-credential-remove]');
    if (remove) {
      const container = remove.closest('[id$="Rows"]');
      remove.closest('[data-credential-row]').remove();
      if (!container.querySelector('[data-credential-row]')) {
        container.innerHTML = '<div class="credential-empty">No credentials added.</div>';
      }
    }
  });
  updateServerFormVisibility();
  attachServerSetupEvents();
}

function showAgentIconFallback() {
  const name = $('formEl')?.querySelector('input[name="name"]')?.value || '?';
  $('agentIconPreview').textContent = name.trim().charAt(0).toUpperCase() || '?';
}

function attachAgentIconEvents() {
  const input = $('agentIconInput');
  const choose = $('agentIconChoose');
  const remove = $('agentIconRemove');
  const name = $('formEl')?.querySelector('input[name="name"]');
  if (!input || !choose || !remove) return;
  name?.addEventListener('input', () => {
    if (pendingAgentIcon === '' || (pendingAgentIcon === undefined && !S.editing?.has_icon)) {
      showAgentIconFallback();
    }
  });
  choose.addEventListener('click', () => input.click());
  remove.addEventListener('click', () => {
    pendingAgentIcon = '';
    input.value = '';
    choose.textContent = 'Choose image';
    showAgentIconFallback();
  });
  input.addEventListener('change', () => {
    const file = input.files?.[0];
    if (!file) return;
    const allowed = ['image/png', 'image/jpeg', 'image/webp', 'image/gif'];
    if (!allowed.includes(file.type)) {
      $('formError').textContent = 'Choose a PNG, JPEG, WebP, or GIF image.';
      input.value = '';
      return;
    }
    if (file.size > 512 * 1024) {
      $('formError').textContent = 'The icon must be smaller than 512 KB.';
      input.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      pendingAgentIcon = String(reader.result || '');
      $('agentIconPreview').innerHTML = `<img src="${esc(pendingAgentIcon)}" alt="">`;
      choose.textContent = 'Replace image';
      $('formError').textContent = '';
    };
    reader.onerror = () => {
      $('formError').textContent = 'The selected icon could not be read.';
    };
    reader.readAsDataURL(file);
  });
}

/* ========== form submit ========== */
async function onFormSubmit(e) {
  e.preventDefault();
  const f = e.target;
  const errEl = $('formError');
  errEl.textContent = '';
  const data = new FormData(f);
  const body = Object.fromEntries(data.entries());
  // Parse numeric fields for agents
  if (S.tab === 'agents') {
    if (!S.models.length || !body.model_id) {
      errEl.textContent = 'Create and select a model before creating the subagent.';
      return;
    }
    if (!S.servers.length || !body.mcp_server_id) {
      errEl.textContent = 'Create and select an MCP server before creating the subagent.';
      return;
    }
    body.model_id = +body.model_id;
    body.mcp_server_id = +body.mcp_server_id;
    const mode = body.confirmation_mode;
    delete body.confirmation_mode;
    if (mode === 'all') {
      body.confirm_tools = ['*'];
    } else if (mode === 'selected') {
      body.confirm_tools = [...pendingConfirmationTools];
      if (!body.confirm_tools.length) {
        errEl.textContent = 'Select at least one action that requires confirmation.';
        return;
      }
    } else {
      body.confirm_tools = [];
    }
    body.confirm_tool_calls = body.confirm_tools.length > 0;
    body.dedupe_tools = [...pendingDedupeTools];
    if (pendingAgentIcon !== undefined) body.icon_data = pendingAgentIcon;
  }
  try {
    if (S.tab === 'servers') {
      if (body.transport === 'stdio') {
        body.headers = '{}';
        body.auth_scheme = '';
        body.env = JSON.stringify(
          collectCredentialRows('environmentRows', 'Credential')
        );
      } else {
        body.env = '{}';
        const mode = $('remoteAuthMode').value;
        let headers = {};
        body.auth_scheme = mode;
        if (mode === 'credential') {
          const method = $('credentialDelivery').value;
          body.auth_scheme = method;
          const secret = $('credentialSecret').value.trim();
          if (!secret) throw new Error('Token or API key is required.');
          if (method === 'bearer') {
            headers.Authorization = `Bearer ${secret}`;
          } else {
            const header = $('credentialHeader').value.trim();
            if (!header) throw new Error('API key header name is required.');
            headers[header] = secret;
          }
        } else if (mode === 'custom') {
          headers = collectCredentialRows('headerRows', 'Header');
        }
        body.headers = JSON.stringify(headers);
      }
    }
    if (S.editing) {
      await api('PUT', API[S.tab].update(S.editing.id), body);
    } else {
      await api('POST', API[S.tab].create, body);
    }
    await loadAll();
    if (S.tab === 'profile') {
      S.editing = S.profile;
      S.formReadonly = true;
      S.view = 'form';
      renderForm();
      return;
    }
    S.editing = null;
    S.formReadonly = true;
    S.view = 'list';
    render();
  } catch (ex) {
    errEl.textContent = ex.message;
  }
}

/* ========== list events (click item / delete) ========== */
$('content').addEventListener('click', async e => {
  const zoomControl = e.target.closest('[data-zoom]');
  if (zoomControl) {
    const action = zoomControl.dataset.zoom;
    setCanvasZoom(action === 'reset' ? 1 : canvasZoom + (action === 'in' ? .1 : -.1));
    return;
  }
  const telegramNode = e.target.closest('[data-open-telegram]');
  if (telegramNode) {
    S.tab = 'telegram';
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === 'telegram');
    });
    renderTelegram();
    return;
  }
  const whatsappNode = e.target.closest('[data-open-whatsapp]');
  if (whatsappNode) {
    S.tab = 'whatsapp';
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === 'whatsapp');
    });
    renderWhatsApp();
    return;
  }
  const supervisorNode = e.target.closest('[data-open-supervisor]');
  if (supervisorNode) {
    openSupervisor();
    return;
  }
  const builtinNode = e.target.closest('[data-builtin-key]');
  if (builtinNode) {
    openBuiltinAgent(builtinNode.dataset.builtinKey);
    return;
  }
  // Dynamic nodes in the topology open their real subagent configuration.
  const agentNode = e.target.closest('[data-agent-id]');
  if (agentNode) {
    const item = S.agents.find(agent => agent.id === +agentNode.dataset.agentId);
    if (!item) return;
    S.tab = 'agents';
    S.view = 'form';
    S.editing = item;
    S.formReadonly = true;
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === 'agents');
    });
    renderForm();
    return;
  }
  // Delete button
  const delBtn = e.target.closest('[data-action="delete"]');
  if (delBtn) {
    const row = delBtn.closest('.list-item');
    const id = +row.dataset.id;
    const list = items();
    const item = list.find(x => x.id === id);
    if (!item) return;
    if (!await showConfirm(`Delete “${item.name}”? This cannot be undone.`, 'Delete')) return;
    try {
      await api('DELETE', API[S.tab].del(id));
      await loadAll();
      render();
    } catch (ex) { alert(ex.message); }
    return;
  }
  // Click on a row (edit)
  const row = e.target.closest('.list-item');
  if (!row) return;
  const id = +row.dataset.id;
  const list = items();
  const item = list.find(x => x.id === id);
  if (!item) return;
  S.editing = item;
  S.formReadonly = true;
  renderForm();
});

$('content').addEventListener('keydown', e => {
  const telegramNode = e.target.closest('[data-open-telegram]');
  if (telegramNode && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    telegramNode.click();
    return;
  }
  const whatsappNode = e.target.closest('[data-open-whatsapp]');
  if (whatsappNode && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    whatsappNode.click();
    return;
  }
  const supervisorNode = e.target.closest('[data-open-supervisor]');
  if (supervisorNode && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    openSupervisor();
    return;
  }
  const builtinNode = e.target.closest('[data-builtin-key]');
  if (builtinNode && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    openBuiltinAgent(builtinNode.dataset.builtinKey);
    return;
  }
  const agentNode = e.target.closest('[data-agent-id]');
  if (!agentNode || (e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault();
  agentNode.click();
});

$('content').addEventListener('change', async e => {
  const toggle = e.target.closest('[data-subagent-enabled]');
  if (!toggle) return;
  const id = Number(toggle.dataset.subagentEnabled);
  const requested = Boolean(toggle.checked);
  const feedback = $('agentAvailabilityFeedback');
  toggle.disabled = true;
  if (feedback) feedback.textContent = 'Saving…';
  try {
    const updated = await api('PUT', API.agents.update(id), { enabled: requested });
    try { S.heartbeat = await api('GET', '/api/heartbeat'); } catch (_) {}
    const index = S.agents.findIndex(item => item.id === id);
    if (index >= 0) S.agents[index] = updated;
    S.editing = updated;
    renderForm();
  } catch (error) {
    toggle.checked = !requested;
    toggle.disabled = false;
    if (feedback) feedback.textContent = error.message;
  }
});

$('content').addEventListener('wheel', e => {
  const viewport = e.target.closest('#workflowCanvas');
  if (!viewport || (!e.ctrlKey && !e.metaKey)) return;
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  setCanvasZoom(
    canvasZoom + (e.deltaY < 0 ? .1 : -.1),
    e.clientX - rect.left,
    e.clientY - rect.top
  );
}, { passive: false });

let canvasPan = null;
$('content').addEventListener('pointerdown', e => {
  const viewport = e.target.closest('#workflowCanvas');
  if (!viewport || e.button !== 0 || e.target.closest('.agent-node, .zoom-controls')) return;
  canvasPan = {
    viewport,
    pointerId: e.pointerId,
    x: e.clientX,
    y: e.clientY,
    left: viewport.scrollLeft,
    top: viewport.scrollTop,
  };
  viewport.classList.add('is-panning');
  viewport.setPointerCapture(e.pointerId);
  e.preventDefault();
});

$('content').addEventListener('pointermove', e => {
  if (!canvasPan || e.pointerId !== canvasPan.pointerId) return;
  canvasPan.viewport.scrollLeft = canvasPan.left - (e.clientX - canvasPan.x);
  canvasPan.viewport.scrollTop = canvasPan.top - (e.clientY - canvasPan.y);
});

function stopCanvasPan(e) {
  if (!canvasPan || e.pointerId !== canvasPan.pointerId) return;
  canvasPan.viewport.classList.remove('is-panning');
  if (canvasPan.viewport.hasPointerCapture(e.pointerId)) {
    canvasPan.viewport.releasePointerCapture(e.pointerId);
  }
  canvasPan = null;
}
$('content').addEventListener('pointerup', stopCanvasPan);
$('content').addEventListener('pointercancel', stopCanvasPan);

/* ========== header buttons ========== */
$('createBtn').addEventListener('click', () => {
  S.editing = null;
  S.formReadonly = false;
  renderForm();
});

$('testBtn').addEventListener('click', async () => {
  if (S.tab !== 'servers' || !S.editing) return;
  const err = $('formError');
  if (err) err.textContent = '';
  await loadServerTools(true);
});

$('modifyBtn').addEventListener('click', () => {
  if (S.formReadonly) {
    S.formReadonly = false;
    renderForm();
    return;
  }
  const f = $('formEl');
  if (!f || !f.reportValidity()) return;
  const fakeEvent = { target: f, preventDefault: () => {} };
  onFormSubmit(fakeEvent);
});

/* ========== sidebar navigation ========== */
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.tab !== 'telegram') {
      stopTelegramPairPolling();
      stopTelegramStatusPolling();
    }
    if (btn.dataset.tab !== 'whatsapp') stopWhatsAppPairPolling();
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    S.tab = btn.dataset.tab;
    S.view = S.tab === 'overview' ? 'overview' : S.tab === 'profile' ? 'form' : 'list';
    S.editing = S.tab === 'profile' ? S.profile : null;
    S.formReadonly = true;
    render();
  });
});

window.addEventListener('resize', () => {
  if (S.tab === 'overview') requestAnimationFrame(drawWorkflowLinks);
});

/* ========== cancel button ========== */
$('cancelBtn').addEventListener('click', () => {
  if (S.tab === 'profile') {
    S.editing = S.profile;
    S.view = 'form';
    S.formReadonly = true;
    renderForm();
    return;
  }
  S.editing = null;
  S.view = 'list';
  S.formReadonly = true;
  render();
});

/* ========== delete button (readonly form) ========== */
$('deleteBtn').addEventListener('click', async () => {
  if (!S.editing) return;
  if (!await showConfirm(`Delete “${S.editing.name}”? This cannot be undone.`, 'Delete')) return;
  try {
    await api('DELETE', API[S.tab].del(S.editing.id));
    S.editing = null;
    S.view = 'list';
    S.formReadonly = true;
    await loadAll();
    render();
  } catch (ex) { alert(ex.message); }
});

/* ========== init ========== */
async function init() {
  await loadAll();
  render();
  if (document.fonts?.ready) {
    document.fonts.ready.then(() => {
      if (S.tab === 'overview') drawWorkflowLinks();
    });
  }
}
init();
</script>

<!-- built-in specialist details -->
<div class="overlay" id="builtinOverlay">
  <div class="modal-builtin" role="dialog" aria-modal="true" aria-labelledby="builtinModalTitle">
    <button class="builtin-modal-close" type="button" id="builtinClose" aria-label="Close">×</button>
    <div id="builtinModalContent"></div>
  </div>
</div>

<!-- confirm modal -->
<div class="overlay" id="confirmOverlay">
  <div class="modal-confirm">
    <div class="modal-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e07a4a" stroke-width="1.8" stroke-linecap="round">
        <path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>
      </svg>
    </div>
    <div class="modal-title">Confirm action</div>
    <div class="modal-desc" id="confirmMsg"></div>
    <div class="modal-actions">
      <button class="btn" id="confirmCancelBtn">Cancel</button>
      <button class="btn primary" id="confirmOkBtn">Continue</button>
    </div>
  </div>
</div>

<script>
/* ========== built-in specialist modal ========== */
const builtinOverlay = $('builtinOverlay');

function closeBuiltinAgent() {
  builtinOverlay.classList.remove('show');
  $('builtinModalContent').innerHTML = '';
}

function openSupervisor() {
  const supervisor = S.overview.supervisor || {};
  const capabilities = Array.isArray(supervisor.tools) ? supervisor.tools : [];
  const options = Array.isArray(supervisor.model_options) ? supervisor.model_options : [];
  $('builtinModalContent').innerHTML = `
    <div class="builtin-modal-head">
      <div class="builtin-modal-icon">${esc((supervisor.name || 'M').charAt(0).toUpperCase())}</div>
      <div>
        <div class="builtin-modal-title" id="builtinModalTitle">${esc(supervisor.name || 'Mounir')}</div>
        <div class="builtin-modal-provider">Supervisor · ${esc(supervisor.provider || 'No model selected')}</div>
      </div>
    </div>
    <div class="builtin-modal-description">${esc(supervisor.description || 'Coordinates requests and delegates focused work to specialists.')}</div>
    <section class="builtin-modal-section">
      <h4>Language model</h4>
      ${options.length ? `
        <select class="builtin-model-select" id="supervisorModelSelect">
          ${options.map(option => `<option value="${option.id}"${+option.id === +supervisor.model_id ? ' selected' : ''}>${esc(option.label)}</option>`).join('')}
        </select>
        <div class="builtin-model-hint">Choose a saved Mistral, Groq, or Ollama model. Ollama models can run locally. Changes apply to the next message.</div>` : `
        <div class="setup-prerequisite">
          <strong>No compatible models are available.</strong> Create a Mistral, Groq, or Ollama model first.
          <button type="button" class="setup-link" data-create-prerequisite="models">Create model</button>
        </div>`}
    </section>
    <section class="builtin-modal-section">
      <h4>Capabilities</h4>
      <div class="builtin-capability-list">
        ${capabilities.length ? capabilities.map(tool => `
          <div class="builtin-capability">
            <strong>${esc(readableToolName(tool.name))}</strong>
            <span>${esc(tool.description || 'No description available.')}</span>
          </div>`).join('') : '<div class="builtin-capability"><span>No tools available.</span></div>'}
      </div>
    </section>
    <div class="builtin-modal-feedback" id="builtinModalFeedback"></div>
    <div class="builtin-modal-actions">
      <button class="btn" type="button" id="builtinCancel">Close</button>
      <button class="btn primary" type="button" id="supervisorSave"${options.length ? '' : ' disabled'}>Save model</button>
    </div>`;
  builtinOverlay.classList.add('show');
  $('builtinCancel').addEventListener('click', closeBuiltinAgent);
  $('supervisorSave').addEventListener('click', async event => {
    event.target.disabled = true;
    const feedback = $('builtinModalFeedback');
    feedback.textContent = 'Saving…';
    try {
      S.overview.supervisor = await api('PUT', '/api/supervisor', {
        model_id: Number($('supervisorModelSelect').value),
      });
      closeBuiltinAgent();
      renderOverview();
    } catch (error) {
      feedback.textContent = error.message;
      event.target.disabled = false;
    }
  });
}

function openBuiltinAgent(key) {
  const agent = (S.overview.builtins || []).find(item => item.key === key);
  if (!agent) return;
  const tools = Array.isArray(agent.tools) ? agent.tools : [];
  const options = Array.isArray(agent.model_options) ? agent.model_options : [];
  const enabled = agent.enabled !== false && Number(agent.enabled) !== 0;
  $('builtinModalContent').innerHTML = `
    <div class="builtin-modal-head">
      <div class="builtin-modal-icon">${esc((agent.name || '?').charAt(0).toUpperCase())}</div>
      <div>
        <div class="builtin-modal-title" id="builtinModalTitle">${esc(agent.name)}</div>
        <div class="builtin-modal-provider">Built-in specialist · ${esc(agent.provider)}</div>
      </div>
    </div>
    <div class="builtin-modal-description">${esc(agent.description || `Built-in ${assistantLabel()} specialist.`)}</div>
    <section class="builtin-modal-section">
      <h4>Availability</h4>
      <div class="agent-availability" style="justify-content:space-between">
        <div class="agent-availability-copy" style="text-align:left">
          <strong id="builtinAvailabilityLabel">${enabled ? 'Active' : 'Inactive'}</strong>
          <span>Inactive specialists cannot receive requests or run heartbeat checks.</span>
        </div>
        <label class="switch" title="${enabled ? 'Deactivate specialist' : 'Activate specialist'}">
          <input type="checkbox" id="builtinEnabled"${enabled ? ' checked' : ''}>
          <span class="switch-track"></span>
        </label>
      </div>
    </section>
    <section class="builtin-modal-section">
      <h4>Capabilities</h4>
      <div class="builtin-capability-list">
        ${tools.length ? tools.map(tool => `
          <div class="builtin-capability">
            <strong>${esc(readableToolName(tool.name))}</strong>
            <span>${esc(tool.description || 'No description available.')}</span>
          </div>`).join('') : '<div class="builtin-capability"><span>No tools available.</span></div>'}
      </div>
    </section>
    <section class="builtin-modal-section">
      <h4>Language model</h4>
      ${options.length ? `
        <select class="builtin-model-select" id="builtinModelSelect">
          ${options.map(option => `<option value="${option.id}"${+option.id === +agent.model_id ? ' selected' : ''}>${esc(option.label)}</option>`).join('')}
        </select>
        <div class="builtin-model-hint">Only saved ${esc(agent.provider)} models are shown.</div>` : `
        <div class="setup-prerequisite">
          <strong>No compatible models are available.</strong> Create a ${esc(agent.provider)} model first.
          <button type="button" class="setup-link" data-create-prerequisite="models">Create model</button>
        </div>`}
    </section>
    <div class="builtin-modal-feedback" id="builtinModalFeedback"></div>
    <div class="builtin-modal-actions">
      <button class="btn" type="button" id="builtinCancel">Close</button>
      <button class="btn primary" type="button" id="builtinSave"${options.length ? '' : ' disabled'}>Save model</button>
    </div>`;
  builtinOverlay.classList.add('show');
  $('builtinCancel').addEventListener('click', closeBuiltinAgent);
  $('builtinEnabled').addEventListener('change', async event => {
    const requested = Boolean(event.target.checked);
    event.target.disabled = true;
    const feedback = $('builtinModalFeedback');
    feedback.textContent = 'Saving…';
    try {
      const updated = await api('PUT', `/api/builtin-agents/${encodeURIComponent(agent.key)}`, {
        enabled: requested,
      });
      try { S.heartbeat = await api('GET', '/api/heartbeat'); } catch (_) {}
      const index = S.overview.builtins.findIndex(item => item.key === agent.key);
      if (index >= 0) S.overview.builtins[index] = updated;
      $('builtinAvailabilityLabel').textContent = requested ? 'Active' : 'Inactive';
      feedback.textContent = '';
      event.target.disabled = false;
      renderOverview();
    } catch (error) {
      event.target.checked = !requested;
      event.target.disabled = false;
      feedback.textContent = error.message;
    }
  });
  $('builtinSave').addEventListener('click', async event => {
    event.target.disabled = true;
    const feedback = $('builtinModalFeedback');
    feedback.textContent = 'Saving…';
    try {
      const updated = await api('PUT', `/api/builtin-agents/${encodeURIComponent(agent.key)}`, {
        model_id: Number($('builtinModelSelect').value),
      });
      const index = S.overview.builtins.findIndex(item => item.key === agent.key);
      if (index >= 0) S.overview.builtins[index] = updated;
      closeBuiltinAgent();
      renderOverview();
    } catch (error) {
      feedback.textContent = error.message;
      event.target.disabled = false;
    }
  });
}

$('builtinClose').addEventListener('click', closeBuiltinAgent);
builtinOverlay.addEventListener('click', event => {
  if (event.target === builtinOverlay) closeBuiltinAgent();
});

/* ========== confirm modal ========== */
let _confirmResolve = null;
const confirmOverlay = $('confirmOverlay');
const confirmMsg = $('confirmMsg');

function showConfirm(msg, confirmLabel = 'Continue') {
  return new Promise(resolve => {
    _confirmResolve = resolve;
    confirmMsg.textContent = msg;
    $('confirmOkBtn').textContent = confirmLabel;
    confirmOverlay.classList.add('show');
  });
}

function closeConfirm(approved) {
  confirmOverlay.classList.remove('show');
  if (_confirmResolve) {
    _confirmResolve(approved);
    _confirmResolve = null;
  }
}

$('confirmOkBtn').addEventListener('click', () => closeConfirm(true));
$('confirmCancelBtn').addEventListener('click', () => closeConfirm(false));
window.addEventListener('keydown', e => {
  if (builtinOverlay.classList.contains('show') && e.key === 'Escape') {
    closeBuiltinAgent();
    return;
  }
  if (!confirmOverlay.classList.contains('show')) return;
  if (e.key === 'Enter') closeConfirm(true);
  if (e.key === 'Escape') closeConfirm(false);
});
</script>
</body>
